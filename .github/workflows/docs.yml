name: Documentación

# Regenera y publica la documentación HTML en GitHub Pages en cada push a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100   # historial para la sección "Historial"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python tools/build_docs.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # activa Pages (fuente: GitHub Actions) si aún no está activado
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
