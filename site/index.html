ntes de **cada** test, así que no necesitamos durabilidad entre tests. Sí necesitamos consistencia: dos requests seguidos deben ver el mismo estado.\n\n## Decisión\nEstado en **memoria del proceso**, con un snapshot del estado inicial que `/__reset` restaura (deep copy). **Una sola instancia y un solo worker.** Un lock alrededor de cada request para serializar el acceso.\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| Redis / Postgres / SQLite | Agrega latencia, infraestructura y un punto de falla, sin beneficio: el estado se reinicia en cada test |\n| Varias instancias con estado compartido | Varias instancias con estado local darían respuestas inconsistentes; compartirlo exige una base de datos (ver arriba). La carga del evaluador no lo justifica |\n\n## Consecuencias\n- **Ganamos:** simplicidad, latencia mínima, reset trivial y determinista.\n- **Perdemos / riesgos:** si el hosting reinicia el proceso, el estado se pierde (aceptable: el test empieza con reset). Hay que **fijar 1 instancia y 1 worker** en el hosting; un autoscaling silencioso rompería la paridad.\n- **Cómo lo medimos:** tests de secuencia (T-seq-*) en el [[Plan de evaluación]].\n", "mtime": "2026-10-10 09:48"}, {"id": "02-arquitectura-decisiones-adr-003", "title": "ADR-003", "path": "docs/02 Arquitectura/Decisiones/ADR-003.md", "group": "02 Arquitectura / Decisiones", "tags": ["decision"], "meta": {"estado": "propuesta", "fecha": "2026-10-10"}, "md": "# ADR-003 — Corpus grabado + tester diferencial como columna vertebral\n\n## Contexto\nHay que entender un servicio sin documentación, demostrar con evidencia cada regla de la spec, llevar un log de experimentos y saber en todo momento qué tan parecido es el reemplazo. Además, a mitad del día habrá un incidente que puede cambiar el comportamiento.\n\n## Decisión\nTodo sondeo al original pasa por un **prober propio** que hace `reset` → secuencia → y graba cada request/response en un **corpus JSONL versionado**. Un **tester diferencial** reproduce las mismas secuencias contra el reemplazo y compara. El corpus se divide en:\n- **Desarrollo:** lo que vemos para escribir la spec.\n- **Hold-out:** secuencias generadas con otra semilla del fuzzer que **no miramos**; simulan el set oculto.\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| Exploración manual con curl/Postman | Sin rastro reproducible: no alimenta el log ni la spec, y no sirve para regresiones ni para detectar el incidente |\n| Herramientas que generan specs o clones automáticamente | Prohibidas por las reglas (\"hacen el trabajo por ti\"). Fuzzer y scripts propios sí están permitidos |\n| Medir solo con el corpus de desarrollo | Sobreajuste: el set oculto corre sobre algo que no hemos visto. El hold-out estima la generalización |\n\n## Consecuencias\n- **Ganamos:** cada regla tiene evidencia; métrica de paridad continua; detección del incidente por diff; el log de experimentos se escribe solo.\n- **Perdemos / riesgos:** cuesta construir el banco de pruebas antes de ver resultados (~1 h). Si el original tiene rate limit, hay que dosificar el fuzzing.\n- **Cómo lo medimos:** es el propio mecanismo de medición → [[Plan de evaluación]].\n", "mtime": "2026-10-10 09:48"}, {"id": "02-arquitectura-decisiones-adr-004", "title": "ADR-004", "path": "docs/02 Arquitectura/Decisiones/ADR-004.md", "group": "02 Arquitectura / Decisiones", "tags": ["decision"], "meta": {"estado": "propuesta", "fecha": "2026-10-10"}, "md": "# ADR-004 — Hosting siempre encendido, una instancia\n\n## Contexto\nEl entrypoint debe estar accesible desde internet **desde las 20:00 hasta el final del demo day**, con `GET /health` y el token del equipo. El estado vive en memoria ([[ADR-002]]), así que necesitamos exactamente una instancia, sin cold starts ni suspensión por inactividad.\n\n## Decisión\n**Por decidir.** Criterios: siempre encendido, 1 instancia fija, secretos por variable de entorno, deploy desde git en minutos, HTTPS incluido y **que no inyecte respuestas propias** (páginas de error del proxy, redirects).\n\n| Opción | A favor | En contra |\n|---|---|---|\n| Fly.io | Máquina persistente, `min_machines_running=1`, control de instancias | Requiere tarjeta; configurar `fly.toml` |\n| Railway | Deploy desde GitHub muy rápido, siempre encendido | Plan de pago para uptime garantizado |\n| Render (pago) | Simple | El plan gratis se duerme → cold start = fallos en el set oculto |\n| VM propia (EC2/DO) | Control total | Más setup (TLS, proceso, reinicios) |\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| Serverless (Lambda, Cloud Run escalado a 0, Vercel functions) | El estado en memoria no sobrevive entre invocaciones y puede haber varias instancias en paralelo |\n| Plan gratis con suspensión | Cold starts y riesgo de que la primera llamada del evaluador falle |\n\n## Consecuencias\n- **Desplegar temprano** (antes de las 13:00 un esqueleto con `/health`) para descubrir problemas del proxy del hosting.\n- El tester diferencial debe correr también contra la URL desplegada, no solo contra local.\n", "mtime": "2026-10-10 09:48"}, {"id": "02-arquitectura-decisiones", "title": "Decisiones", "path": "docs/02 Arquitectura/Decisiones.md", "group": "02 Arquitectura", "tags": ["arquitectura", "moc"], "meta": {}, "md": "# Registro de decisiones\n\n> [!tip] Regla de la rúbrica\n> Cada decisión dice qué alternativa descartó y por qué. Para una decisión nueva, crea una nota en `Decisiones/` con la plantilla [[Plantillas/Decisión]].\n\n| ID | Decisión | Elegido | Descartado | Estado |\n|---|---|---|---|---|\n| [[ADR-001]] | Núcleo HTTP | Catch-all ASGI puro sobre uvicorn | Routing de FastAPI/Flask | propuesta |\n| [[ADR-002]] | Dónde vive el estado | Memoria, 1 proceso, snapshot inicial | Base de datos (Redis/Postgres/SQLite) | propuesta |\n| [[ADR-003]] | Cómo descubrimos y verificamos el comportamiento | Prober con log + ajuste offline + validación predictiva + replay diferencial | curl/Postman manual; herramientas automáticas | aplicada |\n| [[ADR-004]] | Hosting | Railway, siempre encendido, 1 réplica | Serverless; planes gratis que se duermen | propuesta |\n| ADR-005 | Lenguaje | Python 3.10 en el banco y en el reemplazo | Node / Go | propuesta |\n| ADR-006 | Entradas desconocidas | Default explícito marcado `supuesto` | Adivinar en silencio / fallback a LLM | propuesta |\n| ADR-007 | Confianza en la spec | `confirmado` solo con ≥ 2 repeticiones o una predicción sobre entrada no vista | Confirmar lo visto una sola vez | aplicada |\n\nDetalle de las 7 decisiones con su justificación: README del repo → *Decisiones de Diseño*.\n", "mtime": "2026-10-10 10:09"}, {"id": "03-medición-plan-de-evaluación", "title": "Plan de evaluación", "path": "docs/03 Medición/Plan de evaluación.md", "group": "03 Medición", "tags": ["medicion"], "meta": {}, "md": "# Plan de evaluación\n\n> [!important] El set oculto llama `/__reset` y luego manda requests que compara contra el original. Nuestro tester diferencial hace lo mismo con el corpus grabado ([[ADR-003]]).\n\n## Unidad de prueba\nUn **caso** = `reset` + secuencia de N requests. Cada respuesta se compara contra la grabada del original.\n\n## Métricas\n> [!note] Comparador idéntico al del jurado (README)\n> Mismo status **y** mismo cuerpo. Si ambos cuerpos son JSON: el orden de las claves no importa, pero arrays, strings y números deben ser idénticos. Si alguno no es JSON: texto exacto. **Los headers no se comparan.** 5 s por paso.\n\n| Métrica | Definición exacta | Umbral objetivo |\n|---|---|---|\n| **Tests pasados (oficial)** | Los 100 tests del jurado, consultados en `/evento/resultados` | ≥ 90/100 |\n| **Paridad de casos (local)** | % de secuencias de nuestro corpus en las que **todas** las respuestas coinciden según el comparador del jurado | ≥ 90% en hold-out |\n| **Paridad de pasos** | % de respuestas individuales iguales | ≥ 97% |\n| **Paridad de status** | % de respuestas con el mismo código HTTP | ≥ 99% |\n| **Mezcla del jurado** | Paridad de casos ponderada como el set: 40% de 1 request, 45% de 2–5 y 15% de 6–12 | ≥ 90% |\n| **Brecha dev → hold-out** | Paridad en dev − paridad en hold-out | < 5 pts (si es mayor, estamos sobreajustando) |\n| **Cobertura** | Rutas, métodos y códigos de error distintos observados en el original y respaldados en la spec | Crece en cada iteración; reportar el número |\n| **Disponibilidad** | `/health` 200 y latencia p95 contra el despliegue | 200 siempre; p95 < 1 s (límite: 5 s) |\n| **Spec respaldada** | % de filas de la spec con al menos un `id` del log; afirmaciones `confirmado` sin repetición | 100% con evidencia; 0 afirmaciones sin probar marcadas `confirmado` |\n| **Presupuesto** | Requests usados del cupo de 8.000/día por token | < 6.000 antes de las 18:00 (reserva para revalidar el incidente) |\n\nTodas se reportan **desglosadas por categoría**: éxito · error de validación · auth · ruta inexistente · método no permitido · secuencia con estado.\n\n## Casos de prueba\n| ID | Tipo | Qué prueba | Viene de |\n|---|---|---|---|\n| T-health | contrato | `GET /health` con token → 200 | [[Brief]] |\n| T-reset | contrato | `POST /__reset` con token restaura el estado; con token ajeno o sin token responde como el original | [[Brief]], S5 |\n| T-404 | ruta inexistente | Rutas aleatorias, profundas, con caracteres raros | H1 |\n| T-405 | método | Cada método (GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS) en cada ruta conocida | H1 |\n| T-slash | formato de ruta | `/x` vs `/x/` vs `/X` vs `//x` vs query strings | H1 |\n| T-auth-* | auth | Sin header, `Bearer` vacío, token incorrecto, esquema en minúsculas, espacios extra | H4 |\n| T-body-* | validación | JSON inválido, vacío, tipos y campos incorrectos, `Content-Type` incorrecto | H5 |\n| T-edge-* | límites | Strings largos, números extremos, unicode, valores negativos y vacíos | H8 |\n| T-seq-* | estado | Crear → leer → modificar → borrar → leer; operaciones repetidas; orden alterado | H2 |\n| T-det | determinismo | Misma secuencia 2 veces tras reset → ¿respuestas idénticas? | H3 |\n| T-format | formato | Comparación byte a byte (espacios, orden de claves, salto de línea final) | H6 |\n\n## Cómo se corre\n```bash\npython -m bench.diff --target http://localhost:8000 --split holdout\n```\n\n## Resultados\n| Hora | Versión | Estricta | Status | Normalizada | Casos | Notas |\n|---|---|---|---|---|---|---|\n", "mtime": "2026-10-10 09:50"}, {"id": "04-ejecución-entrega", "title": "Entrega", "path": "docs/04 Ejecución/Entrega.md", "group": "04 Ejecución", "tags": ["ejecucion"], "meta": {"entrega": "20:00"}, "md": "# Entrega — 20:00\n\n- [ ] **Repo público**\n- [ ] **Servicio desplegado** y probado desde una máquina/red distinta\n- [ ] Entrypoint claro y documentado en el README\n- [ ] Corre contra el set de evaluaciones oculto (formato de entrada/salida verificado)\n- [ ] **Video de 2 minutos**\n- [ ] Resultados del [[Plan de evaluación]] actualizados\n- [ ] **Transcripts** de las sesiones con agentes → [[Reglas#Transcripts]]\n- [ ] Sin secretos en el repo; `.env.example` presente\n- [ ] *(Reto 2)* Especificación\n- [ ] *(Reto 2)* [[Log de experimentos]]\n\n## Entrypoint\n```bash\n# comando exacto\n```\n\n## URL del servicio\n-\n\n## Guion del video (2 min)\n1. Problema (15 s)\n2. Demo del servicio desplegado (60 s)\n3. Métricas y una decisión clave (30 s)\n4. Cómo absorbimos el [[Incidente]] (15 s)\n", "mtime": "2026-10-10 09:42"}, {"id": "04-ejecución-especificación", "title": "Especificación", "path": "docs/04 Ejecución/Especificación.md", "group": "04 Ejecución", "tags": ["ejecucion", "reto2", "entregable"], "meta": {"entrega": "20:00"}, "md": "# Especificación del servicio original\n\n> [!important] Formato obligatorio (README del material)\n> - Cada comportamiento tiene **ID · Comportamiento · Evidencia · Confianza**.\n> - **Evidencia** = los `id` de las líneas de `experimentos.jsonl` que lo prueban.\n> - **Confianza:** `confirmado` (probado y se repite) · `probable` (visto una vez o inferido) · `supuesto` (no probado; es lo que hace el reemplazo por defecto).\n> - El juez puntúa cada comportamiento bien descrito con evidencia. **Una afirmación falsa resta** → ante la duda, `probable` o `supuesto`, nunca `confirmado`.\n>\n> Versión entregable final: `spec/ESPECIFICACION.md` en el repo. Esta nota es el borrador de trabajo.\n\n## 1. Entrada\n_Rutas, métodos, autenticación, forma del cuerpo y límites._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| IN-01 | | | |\n\n## 2. Integridad\n_Cómo valida el servicio que un mensaje está bien formado (control)._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| INT-01 | | | |\n\n## 3. Comandos\n_Un bloque por comando: argumentos, efecto y respuesta._\n### PING\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### ALTA\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### CONSULTA\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### DEPOSITO\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### TRANSFER\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### ANULA\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n\n## 4. Memoria entre requests\n_Qué recuerda el servicio y qué cambia una respuesta según los requests anteriores._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| MEM-01 | | | |\n\n## 5. Errores\n_Cada error con su status, su cuerpo exacto y el orden en que se evalúa frente a los demás._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| ERR-01 | | | |\n\n## 6. Cambios durante el día\n_Qué cambió, desde cuándo y cómo lo detectamos._ → [[Incidente]]\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n\n## 7. Riesgos\n_Comportamientos que un cliente nuevo no debería heredar y cómo los cerraríamos._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| RSK-01 | | | |\n", "mtime": "2026-10-10 09:50"}, {"id": "04-ejecución-incidente", "title": "Incidente", "path": "docs/04 Ejecución/Incidente.md", "group": "04 Ejecución", "tags": ["ejecucion", "incidente"], "meta": {}, "md": "# Incidente\n\n> [!warning] Llega a mitad del día y sin aviso. Esta nota se llena en el momento. Cómo respondemos también es material para el demo y el debrief.\n\n## Qué cambió\n- **Hora:**\n- **Descripción (tal como llegó):**\n\n## Impacto\n- **Qué componentes afecta:** → [[Arquitectura]]\n- **Qué supuestos rompe:** → [[Supuestos y alcance]]\n- **Evals antes del cambio:**\n- **Evals después del cambio (sin arreglar):**\n\n## Respuesta\n| Hora | Acción | Resultado |\n|---|---|---|\n| | | |\n\n## Decisiones tomadas\n- (crear ADR si aplica) → [[Decisiones]]\n\n## Evals después del arreglo\n| Métrica | Antes | Durante | Después |\n|---|---|---|---|\n\n## Lecciones\n-\n", "mtime": "2026-10-10 09:24"}, {"id": "04-ejecución-log-de-experimentos", "title": "Log de experimentos", "path": "docs/04 Ejecución/Log de experimentos.md", "group": "04 Ejecución", "tags": ["ejecucion", "reto2", "entregable"], "meta": {}, "md": "# Log de experimentos\n\n> [!important] Entregable: `experimentos.jsonl` en la raíz del repo, **una línea por cada request que le mandamos al original**, sin excepciones. Lo genera el prober automáticamente; nunca se escribe a mano.\n\n## Formato (README del material)\n```json\n{\"id\": 1, \"seq\": \"s1\", \"x_req\": 1, \"hipotesis\": \"PING responde sin estado\",\n \"request\": {\"m\": \"PING;XX\"}, \"status\": 200, \"response\": {\"pong\": true},\n \"conclusion\": \"responde pong aunque el último campo no sea un número\"}\n```\n| Campo | Qué es |\n|---|---|\n| `id` | Número de línea, único. **La spec cita estos números** |\n| `seq` | Secuencia. Todas sus líneas van después de un reset |\n| `x_req` | Valor del header `X-Req` de la respuesta |\n| `hipotesis` | Qué estábamos probando |\n| `request` / `status` / `response` | Lo enviado y lo recibido |\n| `conclusion` | Qué aprendimos (opcional) |\n\n## Reglas operativas\n- El prober **nunca** guarda el header `Authorization` (credenciales por persona, repo público).\n- Las respuestas con `X-Frontier-Infra: rate-limit` se marcan y **no** cuentan como comportamiento.\n- Cada experimento se lanza con una `hipotesis` explícita. Las `conclusion` se completan después.\n- Presupuesto: 8.000 req/día por token → usar un fuzzer dosificado, sin barridos ciegos.\n\n## Resumen por bloque (para el debrief)\n| Seq | Hora | Hipótesis | Requests | Conclusión |\n|---|---|---|---|---|\n| | | | | |\n\nBaseline y métricas: [[Plan de evaluación]]\n", "mtime": "2026-10-10 09:50"}, {"id": "05-demo-pitch", "title": "Pitch", "path": "docs/05 Demo/Pitch.md", "group": "05 Demo", "tags": ["demo"], "meta": {"entrega": "21:15"}, "md": "# Pitch — 21:15 (2 min + 2 min de preguntas)\n\n| Tiempo | Bloque | Contenido |\n|---|---|---|\n| 0:00–0:20 | Problema | 1 frase + por qué importa |\n| 0:20–1:00 | Qué construimos | demo o captura del servicio desplegado |\n| 1:00–1:30 | Cómo sabemos que funciona | métricas de [[Plan de evaluación]] |\n| 1:30–1:50 | Decisión más interesante / incidente | de [[Decisiones]] o [[Incidente]] |\n| 1:50–2:00 | Cierre | siguiente paso |\n\nPreparación para las preguntas: [[Preguntas probables]]\n", "mtime": "2026-10-10 09:42"}, {"id": "06-debrief-preguntas-probables", "title": "Preguntas probables", "path": "docs/06 Debrief/Preguntas probables.md", "group": "06 Debrief", "tags": ["debrief"], "meta": {}, "md": "# Preguntas probables (debrief de 10 min)\n\n| Pregunta | Respuesta corta | Nota de apoyo |\n|---|---|---|\n| ¿Por qué esta arquitectura y no otra? | | [[Decisiones]] |\n| ¿Qué falla y cómo lo sabes? | | [[Casos difíciles]] |\n| ¿Cómo mediste que funciona? | | [[Plan de evaluación]] |\n| ¿Qué harías con una semana más? | | [[Supuestos y alcance]] |\n", "mtime": "2026-10-10 09:17"}, {"id": "cronograma", "title": "Cronograma", "path": "docs/Cronograma.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Cronograma\n\n| Hora | Etapa | Entrega / evento | Nota |\n|---|---|---|---|\n| 10:10–10:30 | Elección de reto | Reto 2 (elegido a las 09:46) | [[Reto 2]] |\n| 10:30–**12:00** | Systems design | Doc de diseño de **una página** + diagrama | [[Doc de diseño]] · README del repo |\n| 12:00–**20:00** | Ejecución | Repo · entrypoint · video de 2 min · especificación · `experimentos.jsonl` | [[Entrega]] |\n| **15:30** | ⚠️ Incidente | El original cambia sin aviso | [[Incidente]] |\n| 20:00 | — | Los tokens de participante **dejan de funcionar** contra el original | todo grabado antes |\n| 20:00–21:00 | Debrief | 10 min con un juez. El set oculto se corre otra vez sobre la última entrega a tiempo | [[Preguntas probables]] |\n| 21:15–22:15 | Demo day | Pitch de 2 min + 2 min de preguntas | [[Pitch]] |\n| 22:15–23:00 | Premiación | — | — |\n\n> [!tip] Presupuesto de tiempo de la ejecución (12:00 → 20:00)\n> - **12:00–13:00:** esqueleto ASGI desplegado en Railway (`/health`, `/__reset`, 404, 401) + validar en `/evento`\n> - **13:00–15:00:** cerrar la fórmula del control; comandos + errores; `diff.py`; validar en `/evento` cada hora\n> - **15:00–15:30:** grabar el **corpus de regresión** completo (base para detectar el incidente)\n> - **15:30–17:00:** incidente: re-grabar, diff, ajustar; spec sección 6\n> - **17:00–18:30:** casos borde y precedencia de errores; spec completa\n> - **18:30–19:30:** congelar; re-grabar la regresión contra el original vigente; README + video\n> - **19:30–20:00:** entregar todo; verificar el entrypoint desde fuera\n", "mtime": "2026-10-10 10:09"}, {"id": "doc-de-diseño", "title": "Doc de diseño", "path": "docs/Doc de diseño.md", "group": "General", "tags": ["entregable"], "meta": {"entrega": "12:00"}, "md": "# Doc de diseño — _(nombre del sistema)_\n\n> [!warning] Entregable de **una página**. Esta nota es la versión final y resume el resto del vault: aquí solo va lo esencial y el detalle se queda en las notas enlazadas.\n\n## 1. Problema\n_(2–3 frases en nuestras palabras)_ ← [[Brief]]\n\n## 2. Supuestos y fuera de alcance\n- **Supuestos:** … (por qué) ← [[Supuestos y alcance]]\n- **Casos difíciles:** … ← [[Casos difíciles]]\n- **Fuera de alcance:** … (por qué)\n\n## 3. Arquitectura\n![[Arquitectura#Diagrama]]\n\n## 4. Decisiones clave\n| Decisión | Elegimos | Descartamos | Por qué |\n|---|---|---|---|\n| | | | |\n← [[Decisiones]]\n\n## 5. Cómo absorbe cambios\n_(config externa, módulos reemplazables, evals en un comando)_ ← [[Formato de la prueba]]\n\n## 6. Cómo medimos\n- **Métricas:** … (umbral)\n- **Casos de prueba:** N normales / N límite / N adversariales\n← [[Plan de evaluación]]\n", "mtime": "2026-10-10 09:42"}, {"id": "formato-de-la-prueba", "title": "Formato de la prueba", "path": "docs/Formato de la prueba.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Cómo diseñaron la prueba\n\n| # | Característica | Implicación para nosotros | Dónde lo cubrimos |\n|---|---|---|---|\n| 01 | Pruebas del mismo tipo que usan laboratorios como Anthropic u OpenAI para contratar | Evalúan criterio de ingeniería, no solo que funcione: decisiones explícitas, medición y la capacidad de explicarlo | [[Decisiones]] · [[Preguntas probables]] |\n| 02 | Un brief ambiguo, como en la vida real | La ambigüedad es intencional. Cada hueco del brief se convierte en un supuesto escrito, con su razón y qué pasa si es falso. No nos quedamos esperando respuestas | [[Supuestos y alcance]] |\n| 03 | Un set de evaluaciones oculto que corre sobre algo que no han visto | Generalizar, no sobreajustar a nuestros ejemplos. Respetar el formato de entrada/salida al pie de la letra. Fallar de forma controlada (nunca crashear: devolver algo válido) | [[Plan de evaluación]] · [[Entrega]] |\n| 04 | Un incidente a mitad del día, porque en producción las cosas cambian sin avisar | Diseñar para el cambio: configuración fuera del código, componentes desacoplados, evals que se corren en un comando para detectar regresiones. Documentar el incidente al vivo | [[Incidente]] · [[Arquitectura]] |\n\n## Principios de diseño que salen de aquí\n1. **Supuestos explícitos > preguntas abiertas.** Si el brief no lo dice, decidimos, lo escribimos y seguimos.\n2. **Robustez antes que brillantez.** Una respuesta válida y mediocre es mejor que un crash ante el set oculto.\n3. **Todo configurable.** Modelo, prompts, rutas y umbrales se definen en config o env, no hardcodeados.\n4. **Evals en un comando.** Así, después del incidente, sabemos en minutos qué se rompió.\n5. **Cada componente reemplazable.** Si el incidente cambia una fuente de datos o una API, se toca un solo módulo.\n", "mtime": "2026-10-10 09:24"}, {"id": "reglas", "title": "Reglas", "path": "docs/Reglas.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Reglas\n\n| | Regla | Implicación práctica |\n|---|---|---|\n| ✓ | Se pueden y se deben usar modelos y agentes de código. **Se entregan los transcripts y se evalúa cómo los orquestas** | Los transcripts son un entregable más. Hay que trabajar con método: plan → tareas pequeñas → verificar → commit. Pedirle al agente decisiones razonadas, no solo código. Revisar lo que genera. Guardar los transcripts de cada sesión ([[#Transcripts]]) |\n| ✗ | No se pueden usar herramientas o proveedores que hagan el trabajo por ti | Sí valen APIs de modelos, librerías y hosting. No valen plataformas que entreguen la solución armada (no-code end-to-end, templates del mismo problema, servicios \"AI-app-in-a-box\"). Si hay duda, registrarla en [[Decisiones]] con su justificación |\n| ✓ | Todo se construye hoy, en un repo público | Commits desde hoy, pequeños y frecuentes, con mensajes claros: el historial es evidencia. Nada de código previo copiado |\n| ✓ | Las credenciales son por persona: lo que haces en tu escritorio no lo ve tu compañero | Nunca subir secretos. Cada quien con su `.env` local y un `.env.example` versionado. El servicio desplegado usa los secretos de la plataforma de hosting. La configuración debe permitir que cualquiera lo corra con sus propias llaves |\n| ✓ | Presencial y remoto se evalúan con los mismos entregables y los mismos tiempos | Sin ventajas ni excusas: mismo [[Cronograma]] |\n\n## Transcripts\n- Una sesión de agente por tarea grande (diseño, esqueleto, evals, iteración, incidente), con nombre claro.\n- Al cerrar cada sesión: exportar el transcript y guardarlo en `transcripts/` del repo (o donde indiquen los organizadores).\n- Anotar en la bitácora qué sesión resolvió qué cosa.\n\n## Qué evalúa \"cómo orquestas\" (nuestra lectura)\n1. **Contexto:** le das al agente el brief, los supuestos y las restricciones, sin pedirle \"hazme todo\".\n2. **Descomposición:** tareas acotadas y verificables.\n3. **Verificación:** corres tests y evals, y no aceptas código a ciegas.\n4. **Criterio humano:** las decisiones de diseño las tomas tú; el agente propone alternativas.\n5. **Recuperación:** cuando el agente se equivoca, lo detectas y corriges el rumbo.\n", "mtime": "2026-10-10 09:42"}, {"id": "reto-2", "title": "Reto 2", "path": "docs/Reto 2.md", "group": "General", "tags": ["referencia", "reto2"], "meta": {}, "md": "# Reto 2 — La caja negra\n\n> [!abstract] Enunciado\n> Descubre cómo se comporta un servicio sin documentación y construye un reemplazo que responda exactamente igual, **errores incluidos**.\n> Brief y contrato: [[Brief]] · README completo: `material/README.md` · Primeros hallazgos: [[Hallazgos iniciales]]\n\n## Datos clave del material\n| Tema | Dato |\n|---|---|\n| Original | `https://caja-negra-production-c64f.up.railway.app` |\n| Tokens | Uno **por persona** (en `/evento`). **Cada token tiene su propio estado** → se puede explorar en paralelo |\n| Protocolo | `POST /msg` con `{\"m\":\"CMD;args;CONTROL\"}` · `POST /__reset` · `GET /health` |\n| Rate limit | 10 req/s y **8.000 req/día por token**. Si se excede: header `X-Frontier-Infra: rate-limit` (es de la infraestructura, no del servicio: **no** grabarla como comportamiento) |\n| Header `X-Req` | Viene en cada respuesta y va al log (`x_req`) |\n| Cambios | El servicio **puede cambiar durante el día**. Se evalúa contra la versión vigente a las **20:00** |\n| 20:00 | Los tokens de participante **dejan de funcionar** contra el original → todo el corpus tiene que estar grabado antes |\n| LLM | Se permite dentro del reemplazo si responde en < 5 s por paso |\n| Instancias | El set le habla a un solo proceso → **una instancia** ([[ADR-002]]) |\n| Llamar al original | Si el reemplazo lo hace, **el set vale 0** |\n\n## Cómo se evalúa\n- **100 tests**: 40 de 1 request, 45 secuencias de 2–5 y 15 de 6–12. Cada uno empieza con `POST /__reset`. Ninguno repite la secuencia de ejemplo.\n- Pasa si **cada** respuesta tiene el **mismo status** y el **mismo cuerpo**: si es JSON, el orden de claves no importa, pero arrays, strings y números deben ser idénticos; si no es JSON, se compara el texto exacto.\n- **Los headers no se comparan.** 5 s por paso.\n- Se puede validar en `/evento` y ver el resultado en `/evento/resultados` → **feedback real durante el día**.\n- **Spec:** un juez la compara con la lista completa de comportamientos. Cuenta cada uno bien descrito **y que cite una línea del log**. **Una afirmación falsa resta.**\n\n## Entregables extra\n- **Especificación** → [[Especificación]] (estructura fija de 7 secciones)\n- **`experimentos.jsonl`** → [[Log de experimentos]] (una línea por request al original)\n\n## Preguntas abiertas\n- [ ] **Fórmula del control** → [[Hallazgos iniciales#El control (pendiente)]]\n- [ ] Orden de evaluación de los errores (¿integridad → sintaxis → existencia → negocio?)\n- [ ] Respuesta del original sin token, con token inválido y en rutas inexistentes / otros métodos\n- [ ] ¿`ANULA` revierte el saldo? ¿Se puede anular un `DEPOSITO`? ¿Y si deja saldo negativo?\n- [ ] Límite exacto de `TRANSFER` (¿100000?) y si existe para `DEPOSITO`\n- [ ] Montos 0, negativos, con decimales o no numéricos; transferencia a la misma cuenta\n- [ ] Nombres en `ALTA`: vacíos, con unicode, largos, duplicados\n- [ ] ¿Qué es `X-Req`? (¿contador de requests por token?)\n- [ ] Pestaña **Aclaraciones** de la web\n", "mtime": "2026-10-10 09:50"}, {"id": "rúbrica", "title": "Rúbrica", "path": "docs/Rúbrica.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Rúbrica\n\n| Etapa | Peso | Qué se entrega |\n|---|---|---|\n| 01 · Systems design | 30% | Doc de diseño + diagrama (cierre 12:00) |\n| 02 · Ejecución | 40% | Repo, entrypoint, video y set de evaluaciones oculto |\n| 03 · Demo day | 15% | Pitch en tu turno + material opcional |\n| 04 · Profundidad técnica | 15% | Debrief individual de 10 minutos |\n\n## Systems design (escala 1–4 por criterio)\nSe alimenta de: doc de diseño, diagrama de arquitectura.\n\n| Criterio | Qué buscan | 1 se ve así | 4 se ve así | Dónde lo cubrimos |\n|---|---|---|---|---|\n| Entendimiento del problema | Qué tiene que resolver el sistema, sus límites y sus supuestos | Repite el brief sin tomar decisiones | Nombra supuestos, casos difíciles y lo que deja fuera, con razones | [[Supuestos y alcance]], [[Casos difíciles]] |\n| Arquitectura y trade-offs | Componentes claros y decisiones justificadas | Un diagrama sin decisiones detrás | Cada decisión dice qué alternativa descartó y por qué | [[Arquitectura]], [[Decisiones]] |\n| Plan para medir | Cómo van a saber si funciona antes de construir | No hay forma de medir el resultado | Casos de prueba y métricas concretas desde el diseño | [[Plan de evaluación]] |\n", "mtime": "2026-10-10 09:17"}], "exp": {"total": 1247, "budget": 8000, "seqs": [{"seq": "s1-entrada", "n": 18, "first": 1, "last": 18, "hipotesis": "GET /health con token propio responde 200"}, {"seq": "s2-control", "n": 719, "first": 19, "last": 737, "hipotesis": "barrido de control para 'CONSULTA;AC-0000': ¿0 es válido?"}, {"seq": "s3-pred <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const VERSION = document.querySelector('meta[name=doc-version]').content;
let lang = 'es';
try { lang = localStorage.getItem('docs-lang') || 'es'; } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Índice de notas por título (para resolver [[wikilinks]] de Obsidian).
const byTitle = {};
D.docs.forEach(d => { byTitle[d.title.toLowerCase()] = d; byTitle[d.path.replace(/^docs\//,'').replace(/\.md$/,'').toLowerCase()] = d; });
const headingId = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');

function wikilinks(md){
  return md.replace(/!?\[\[([^\]|#]+)(#[^\]|]+)?(\|([^\]]+))?\]\]/g, (m, target, sec, _a, alias) => {
    const d = byTitle[target.trim().toLowerCase()];
    const label = alias || (target.split('/').pop() + (sec ? ' › ' + sec.slice(1) : ''));
    if (!d) return `<span class="wl-missing" title="Nota aún no creada">${esc(label)}</span>`;
    return `[${label}](#/doc/${d.id}${sec ? '~' + headingId(sec.slice(1)) : ''})`;
  });
}

const renderer = new marked.Renderer();
renderer.code = (code, info) => {
  if ((info || '').trim() === 'mermaid') return `<div class="mermaid">${esc(code)}</div>`;
  return `<pre><code>${esc(code)}</code></pre>`;
};
renderer.heading = (text, level, raw) => `<h${level} id="${headingId(raw)}">${text}</h${level}>`;
marked.setOptions({ renderer, gfm: true });

function callouts(root){
  root.querySelectorAll('blockquote').forEach(bq => {
    const p = bq.querySelector('p'); if (!p) return;
    const m = p.innerHTML.match(/^\[!(\w+)\][+-]?\s*([^<\n]*)/); if (!m) return;
    p.innerHTML = p.innerHTML.slice(m[0].length).replace(/^\s*<br>/, '');
    const div = document.createElement('div');
    div.className = 'callout ' + m[1].toLowerCase();
    div.innerHTML = `<div class="ct">${esc(m[2] || m[1])}</div>` + bq.innerHTML;
    bq.replaceWith(div);
  });
}

// Los enlaces relativos a archivos del repo apuntan a GitHub.
const REPO = 'https://github.com/jorgefajardom-coder/Ai-builders-Hackaton/blob/main/';
function fixLinks(root){
  root.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.startsWith('#') && !h.startsWith('#/')) {
      a.addEventListener('click', e => { e.preventDefault(); document.getElementById(h.slice(1))?.scrollIntoView({behavior:'smooth'}); });
    } else if (!/^(https?:|#|mailto:)/.test(h)) {
      a.href = REPO + h.replace(/^\.\//, ''); a.target = '_blank';
    }
  });
}

function show(md, meta){
  const el = document.getElementById('content');
  el.innerHTML = (meta || '') + marked.parse(wikilinks(md));
  callouts(el); fixLinks(el);
  try { mermaid.run({ nodes: el.querySelectorAll('.mermaid') }); } catch (e) { console.warn(e); }
}

function viewHome(){
  show(D.readme[lang] || D.readme.es);
}

function viewDoc(id, anchor){
  const d = D.docs.find(x => x.id === id);
  if (!d) return show('# Nota no encontrada');
  const meta = `<div class="meta"><span>${esc(d.path)}</span><span>· editado ${esc(d.mtime)}</span>${d.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>`;
  show(d.md, meta);
  if (anchor) setTimeout(() => document.getElementById(anchor)?.scrollIntoView(), 50);
}

function viewExp(){
  const E = D.exp;
  if (!E) return show('# Experimentos\n\nAún no hay `experimentos.jsonl`.');
  const pct = Math.min(100, E.total / E.budget * 100).toFixed(1);
  const statusCls = s => 's' + String(s)[0];
  let h = `<h1>Experimentos</h1>
  <p>Generado desde <code>experimentos.jsonl</code>: una línea por cada request al servicio original.</p>
  <div class="cards">
    <div class="card"><div class="k">Requests al original</div><div class="v">${E.total}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="mono">${pct}% del cupo diario (${E.budget})</div></div>
    <div class="card"><div class="k">Secuencias</div><div class="v">${E.seqs.length}</div></div>
    <div class="card"><div class="k">Códigos de error vistos</div><div class="v">${E.errors.length}</div></div>
    <div class="card"><div class="k">Status HTTP</div><div class="v mono" style="font-size:15px">${Object.entries(E.status).map(([s,n]) => `<span class="${statusCls(s)}">${s}</span>×${n}`).join(' · ')}</div></div>
  </div>
  <h2>Catálogo de errores observado</h2>
  <table><thead><tr><th>Código</th><th>Status</th><th>Mensaje exacto</th><th>Veces</th><th>Primera evidencia</th></tr></thead><tbody>
  ${E.errors.map(e => `<tr><td class="mono">${esc(e.code)}</td><td class="mono ${statusCls(e.status)}">${e.status}</td><td class="mono">"${esc(e.mensaje)}"</td><td>${e.count}</td><td class="mono">#${e.first}</td></tr>`).join('')}
  </tbody></table>
  <h2>Secuencias</h2>
  <table><thead><tr><th>Seq</th><th>Requests</th><th>Ids</th><th>Hipótesis inicial</th></tr></thead><tbody>
  ${E.seqs.map(s => `<tr><td class="mono">${esc(s.seq)}</td><td>${s.n}</td><td class="mono">#${s.first}–#${s.last}</td><td>${esc(s.hipotesis)}</td></tr>`).join('')}
  </tbody></table>
  <h2>Log (sin el ruido de los barridos)</h2>
  <input class="search" id="expq" placeholder="Filtrar por id, seq, mensaje, error…">
  <table id="exptable"><thead><tr><th>#</th><th>Seq</th><th>Request</th><th>Status</th><th>Respuesta</th><th>Hipótesis</th></tr></thead><tbody>
  ${E.notable.slice().reverse().map(r => `<tr><td class="mono">${r.id}</td><td class="mono">${esc(r.seq)}</td><td class="mono">${esc((r.metodo||'') + ' ' + (r.ruta||''))}<br>${esc(typeof r.request === 'object' && r.request ? JSON.stringify(r.request) : (r.request ?? ''))}</td><td class="mono ${statusCls(r.status)}">${r.status}</td><td class="mono">${esc(typeof r.response === 'object' ? JSON.stringify(r.response) : r.response)}</td><td>${esc(r.hipotesis)}${r.conclusion ? '<br><b>→ ' + esc(r.conclusion) + '</b>' : ''}</td></tr>`).join('')}
  </tbody></table>`;
  const el = document.getElementById('content'); el.innerHTML = h;
  document.getElementById('expq').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#exptable tbody tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none');
  });
}

function viewHistory(){
  show('# Historial\n\nCommits del repositorio (más recientes primero). Cada commit regenera esta documentación.\n\n| Commit | Fecha | Mensaje |\n|---|---|---|\n' +
    D.commits.map(c => `| [\`${c.hash}\`](https://github.com/jorgefajardom-coder/Ai-builders-Hackaton/commit/${c.hash}) | ${c.date} | ${c.msg.replace(/\|/g,'\\|')} |`).join('\n'));
}

function viewMaterial(){ show(D.material || '# Material\n\nNo disponible.'); }

function buildNav(filter){
  const q = (filter || '').toLowerCase();
  const match = d => !q || d.title.toLowerCase().includes(q) || d.md.toLowerCase().includes(q);
  const groups = {};
  D.docs.filter(match).forEach(d => (groups[d.group] = groups[d.group] || []).push(d));
  let h = `<div class="navgroup"><h4>Proyecto</h4>
    <a href="#/" data-r="#/">Documento de diseño (README)</a>
    <a href="#/exp" data-r="#/exp">Experimentos · ${D.exp ? D.exp.total : 0}</a>
    <a href="#/material" data-r="#/material">Material del reto</a>
    <a href="#/historial" data-r="#/historial">Historial · ${D.commits.length} commits</a></div>`;
  Object.keys(groups).sort((a,b) => a === 'General' ? -1 : b === 'General' ? 1 : a.localeCompare(b)).forEach(g => {
    h += `<div class="navgroup"><h4>${esc(g)}</h4>` + groups[g].map(d => `<a href="#/doc/${d.id}" data-r="#/doc/${d.id}">${esc(d.title)}</a>`).join('') + '</div>';
  });
  document.getElementById('navlist').innerHTML = h;
  markActive();
}

function markActive(){
  const r = location.hash.split('~')[0] || '#/';
  document.querySelectorAll('#navlist a').forEach(a => a.classList.toggle('active', a.dataset.r === r));
}

function route(){
  const h = location.hash || '#/';
  const [path, anchor] = h.slice(1).split('~');
  if (path.startsWith('/doc/')) viewDoc(path.slice(5), anchor);
  else if (path === '/exp') viewExp();
  else if (path === '/historial') viewHistory();
  else if (path === '/material') viewMaterial();
  else viewHome();
  markActive();
  document.getElementById('nav').classList.remove('open');
  if (!anchor) window.scrollTo(0, 0);
}

function setLang(l){
  lang = l; try { localStorage.setItem('docs-lang', l); } catch (e) {}
  document.getElementById('lang-es').classList.toggle('on', l === 'es');
  document.getElementById('lang-en').classList.toggle('on', l === 'en');
  if ((location.hash || '#/') === '#/') viewHome();
}

function initTheme(){
  const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  try { const t = localStorage.getItem('docs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const apply = () => mermaid.initialize({ startOnLoad: false, theme: dark() ? 'dark' : 'default', securityLevel: 'strict' });
  apply();
  document.getElementById('theme').onclick = () => {
    const t = dark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('docs-theme', t); } catch (e) {}
    apply(); route();
  };
}

// Recarga automática: si el sitio se sirve por HTTP y hay una versión nueva, recarga la página.
function liveReload(){
  const dot = document.getElementById('livedot');
  if (!/^https?:/.test(location.protocol)) { dot.style.background = 'var(--muted)'; dot.title = 'Abierto como archivo: sin recarga automática'; return; }
  dot.title = 'Recarga automática activa';
  setInterval(async () => {
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (v.version && v.version !== VERSION) location.reload();
    } catch (e) {}
  }, 10000);
}

document.getElementById('genat').textContent = 'Actualizado ' + D.generated + ' · v' + VERSION;
document.getElementById('q').addEventListener('input', e => buildNav(e.target.value));
document.getElementById('lang-es').onclick = () => setLang('es');
document.getElementById('lang-en').onclick = () => setLang('en');
document.getElementById('menu').onclick = () => document.getElementById('nav').classList.toggle('open');
window.addEventListener('hashchange', route);
initTheme(); setLang(lang); buildNav(); route(); liveReload();
</script>
</body>
</html>
