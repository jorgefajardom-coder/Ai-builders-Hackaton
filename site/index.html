odifican saldos | 1478→1479, 1414–1419 | confirmado |\n| ME-03 | `/__reset` deja todo vacío: contadores AC y OP vuelven a 0001, saldos y anulaciones se borran | 1249, 1341, 1413, 1474, 1495 | confirmado |\n| ME-04 | Determinista: los 20 ejemplos repetidos dos veces tras reset dan respuestas idénticas a las grabadas | 1521–1562 | confirmado |\n| ME-05 | La validez del control depende solo del texto, no del estado | ejemplos 5 y 11, 1252, 1355 | confirmado |\n\n## 5 Errores\n\n| Código | Status | Cuerpo exacto | Evidencia |\n|---|---|---|---|\n| E404 | 404 | `{\"error\":\"E404\",\"mensaje\":\"ruta desconocida\"}` | 10–18 |\n| E001 | 401 | `{\"error\":\"E001\",\"mensaje\":\"no autorizado\"}` | 2, 5–9 |\n| E101 | 413 | `{\"error\":\"E101\",\"mensaje\":\"cuerpo demasiado grande\"}` | 1384, 1405 |\n| E100 | 400 | `{\"error\":\"E100\",\"mensaje\":\"json inválido\"}` | 1366–1368 |\n| E102 | 400 | `{\"error\":\"E102\",\"mensaje\":\"falta m\"}` | 1369–1377 |\n| E103 | 400 | `{\"error\":\"E103\",\"mensaje\":\"falta control\"}` | 1278, 1281, 1282 |\n| E104 | 400 | `{\"error\":\"E104\",\"mensaje\":\"segmento vacío\"}` | 1269, 1299 |\n| E201 | 400 | `{\"error\":\"E201\",\"mensaje\":\"control mal formado\"}` | 1262–1273 |\n| E202 | 400 | `{\"error\":\"E202\",\"mensaje\":\"control inválido\"}` | 1259, 1260 |\n| E301 | 400 | `{\"error\":\"E301\",\"mensaje\":\"comando desconocido \"}` (**espacio final**) + `\"sugerencia\":\"<CMD>\"` si el comando en mayúsculas está a distancia de Levenshtein ≤ 2 de un comando conocido; en empate gana ALTA (PITA, NLA) | 1286, 1306, 1312–1339, 1576 |\n| E302 | 400 | `{\"error\":\"E302\",\"mensaje\":\"aridad inválida\"}` | 1290, 1567 |\n| E303 | 400 | `{\"error\":\"E303\",\"mensaje\":\"monto inválido\"}` | 1414–1418 |\n| E304 | 400 | `{\"error\":\"E304\",\"mensaje\":\"origen y destino iguales\"}` | 1480, 1490 |\n| E401 | 404 | `{\"error\":\"E401\",\"mensaje\":\"cuenta inexistente\"}` | 1356–1364 |\n| E402 | 404 | `{\"error\":\"E402\",\"mensaje\":\"operación inexistente\"}` | 1507–1510 |\n| E506 | 422 | `{\"error\":\"E506\",\"mensaje\":\"límite excedido\"}` | 1478, 1519 |\n| E507 | 422 | `{\"error\":\"E507\",\"mensaje\":\"saldo insuficiente\"}` | 1573 |\n\nDetalle de la sugerencia: Levenshtein clásico (dos transposiciones `OCNSUTLA` → sin sugerencia, 1331), distancia 3 → sin sugerencia (1318, 1335), se compara en mayúsculas y con espacios/tabuladores incluidos (1324–1326), carácter no ASCII cuenta como una edición (1339).\n\n### Orden de evaluación (precedencia)\n\n| # | Chequeo | Error | Evidencia del orden |\n|---|---|---|---|\n| 1 | Ruta y método | E404 | 12, 1410 (antes que auth y tamaño) |\n| 2 | Autorización | E001 | 1406 (antes que tamaño), 1408 (antes que JSON) |\n| 3 | Tamaño > 8192 bytes | E101 | 1407 (antes que JSON) |\n| 4 | JSON válido | E100 | 1366 |\n| 5 | `m` string | E102 | 1282 (`\"\"` pasa) |\n| 6 | Hay al menos un `;` | E103 | 1282, 1278 |\n| 7 | Ningún segmento vacío | E104 | 1301, 1302 (antes que E201), 1305 (antes que PING) |\n| 8 | Si comando = PING: aridad (E302) o pong, sin control | E302 / pong | 1303, 1275 |\n| 9 | Formato del control | E201 | 1288 (antes que E301) |\n| 10 | Valor del control | E202 | 1287 (antes que E301), 1289 (antes que E302) |\n| 11 | Comando conocido | E301 | 1306 (antes que aridad) |\n| 12 | Aridad | E302 | 1566 (antes que E303) |\n| 13 | Monto | E303 | 1427, 1485, 1515 (antes que E401 y E304) |\n| 14 | Origen ≠ destino | E304 | 1514 (antes que E401), 1516 (antes que E506) |\n| 15 | Existencia (cuenta / operación) | E401 / E402 | 1486, 1520 (antes que E506) |\n| 16 | Límite de transferencia | E506 | 1519 (antes que E507) |\n| 17 | Saldo | E507 | 1573 |\n| 18 | ANULA ya anulada | 200 ok:false | 1506 |\n\n## 6 Cambios durante el día\n\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| CB-01 | Hasta el log 1562 el servicio responde igual que los ejemplos de la mañana (sin cambios detectados) | 1521–1562 | confirmado |\n| CB-02 | Para detectar el cambio: volver a correr `bench/exp18_determinismo.py` y `bench/exp05_formula.py` tras las 15:30 | — | supuesto |\n\n## 7 Riesgos\n\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| RI-01 | ANULA deja saldos negativos sin comprobar fondos: un cliente nuevo no debería heredarlo → validar saldo o anular solo si el destino conserva el monto | 1504, 1572 | confirmado |\n| RI-02 | El control mod 97 no es autenticación (se calcula sin secreto) y PING ni siquiera lo valida → usar firma HMAC con clave por cliente | 1274, 1275, IN-03 | confirmado |\n| RI-03 | La sugerencia de E301 filtra la lista de comandos a quien tantea | 1312–1339 | confirmado |\n| RI-04 | Sin validación de nombre (emoji, 8 KB, duplicados) → normalizar y limitar longitud | 1347–1354, 1398 | confirmado |\n| RI-05 | Ids secuenciales predecibles y E401 vs 200 permiten enumerar cuentas → ids opacos | 1355–1364 | confirmado |\n| RI-06 | `X-Req` expone el volumen de tráfico del token | EN-13 | confirmado |\n| RI-07 | La ruta se evalúa antes que la auth (404 vs 401 revela qué rutas existen) | 12, 1410 | confirmado |\n| RI-08 | Inconsistencias a replicar pero no heredar: `recieved`, `cuentaId` vs `cuenta_id`, espacio final en `comando desconocido `, ANULA repetida con 200 | ejemplos 6, 3, 5, 12, 14 | confirmado |\n| RI-09 | Montos de hasta 10 dígitos sin límite de depósito; saldos sin tope → posible desbordamiento por encima de 2^53 | 1421, 1435 | probable |\n\n## Preguntas abiertas\n- Formato de `AC-`/`OP-` a partir de 9999 (requiere 10 000 altas; no probado).\n- Comportamiento tras el incidente de las 15:30.\n", "mtime": "2026-10-10 10:38"}, {"id": "01-problema-hallazgos-iniciales", "title": "Hallazgos iniciales", "path": "docs/01 Problema/Hallazgos iniciales.md", "group": "01 Problema", "tags": ["problema", "reto2"], "meta": {"fuente": "material/pruebas/ejemplos.jsonl"}, "md": "# Hallazgos iniciales (de los 20 ejemplos)\n\n> [!warning] Todo aquí es **probable** hasta repetirlo contra el original y registrarlo en `experimentos.jsonl`. Los ejemplos se grabaron con la versión **de la mañana**: el servicio puede cambiar durante el día.\n\n## Forma del mensaje\n`POST /msg` con `{\"m\": \"COMANDO;arg1;...;argN;CONTROL\"}`. Separador `;`. El último campo es un **control numérico**.\n\n## Comandos vistos\n| Comando | Argumentos | Éxito | Ejemplo |\n|---|---|---|---|\n| `PING` | control | `200 {\"pong\":true}` | #1 |\n| `ALTA` | nombre | `201 {\"cuentaId\":\"AC-0001\"}` (IDs secuenciales `AC-%04d`) | #3, #4 |\n| `CONSULTA` | cuenta | `200 {\"cuenta_id\":…,\"saldo\":N}` ⚠️ usa `cuenta_id` (snake) y `ALTA` usa `cuentaId` (camel) | #5, #8 |\n| `DEPOSITO` | cuenta, monto | `200 {\"status\":\"recieved\",\"operacionId\":\"OP-0001\"}` ⚠️ typo `recieved` | #6, #18 |\n| `TRANSFER` | origen, destino, monto | igual que `DEPOSITO`; los IDs `OP-%04d` son compartidos | #7, #10 |\n| `ANULA` | operación | `200 {\"ok\":true,\"anulada\":\"OP-0003\"}`; la segunda vez `200 {\"ok\":false,\"motivo\":\"ya anulada\"}` | #13, #14 |\n\n- El comando **no distingue mayúsculas**: `CONSULTa` funciona y el control es el mismo que con `CONSULTA` (#11 vs #5).\n- **Saldo inicial 0.** Montos enteros.\n- `TRANSFER` 100000 pasa y 120000 da `E506 límite excedido` → límite por operación entre 100000 y 119999 (¿≤ 100000?).\n- Después de `ANULA OP-0003`, ¿se revierte el saldo? → **por probar** (ningún ejemplo consulta después).\n\n## Errores vistos\n| Código | Status | Mensaje (exacto) | Disparador | Ejemplo |\n|---|---|---|---|---|\n| E201 | 400 | `control mal formado` | control no numérico (`5X`) | #17 |\n| E202 | 400 | `control inválido` | control numérico pero incorrecto | #2 |\n| E301 | 400 | `comando desconocido ` ⚠️ **espacio final** | `SALDOS` | #12 |\n| E302 | 400 | `aridad inválida` | `ALTA` con 2 args | #20 |\n| E401 | 404 | `cuenta inexistente` | `CONSULTA AC-0009` | #15 |\n| E506 | 422 | `límite excedido` | transfer de 120000 | #9 |\n| E507 | 422 | `saldo insuficiente` | transfer > saldo | #16 |\n\nFamilias de códigos: **2xx = integridad · 3xx = sintaxis · 4xx = existencia · 5xx = reglas de negocio**. El orden de evaluación está por determinar.\n\n## El control (pendiente)\nPares válidos conocidos: `ALTA;Lucia→82`, `ALTA;Mateo→3`, `CONSULTA;AC-0001→14`, `…0002→11`, `…0009→87`, `ANULA;OP-0003→66`, …\n- Cambiar el último dígito de la cuenta de 1→2 baja el control en 3; 1→9 lo baja en 24 (14−24 = −10 ≡ **87 mod 97**). Sugiere **una combinación lineal mod 97**.\n- Descartados con fuerza bruta: suma de bytes, hash polinomial `h·B+c` y sumas ponderadas por posición (i, n−i, 1/3 alternos), sobre el mensaje completo, en mayúsculas o solo con los argumentos (`scratch ck*.py`).\n- **Siguiente paso:** experimentos controlados en vivo, variando **un carácter a la vez** y midiendo cuánto cambia el control → peso de cada posición.\n- `PING;XX` responde `pong` según el README → ¿PING no valida el control?\n\n## Estado del control a las 10:15 (pausado para el diseño)\n- Confirmado: lineal mod 97, base 10, `;` y `-` no cuentan, una letra = una posición (log 37–737).\n- **Rango 1–98** (`CONSULTA;A` → 98, log 1160) → firma de **ISO 7064 mod 97-10** (`98 − N mod 97`).\n- El ajuste con D=68, L=53 y una constante por comando **memorizaba pero no predecía** (log 739, 742, 745) → descartado.\n- Mediciones de `CONSULTA;<letra>` en log 797–1247 (Z=50, Q=77, R=74, X=56, Y=53, A=98, E=86).\n- **Retomar en la ejecución:** probar `98 − (N·100 mod 97)` con N = concatenación de valores, letras A=10…Z=35 **sumadas** en una posición decimal (h·10 + v), comando incluido o no; validar con predicción.\n\n## Inconsistencias a replicar (no corregir)\n- `recieved` (typo)\n- `cuentaId` vs `cuenta_id`\n- espacio final en `\"comando desconocido \"`\n- `ANULA` repetido devuelve **200** con `ok:false` (no un 4xx)\n", "mtime": "2026-10-10 10:09"}, {"id": "01-problema-supuestos-y-alcance", "title": "Supuestos y alcance", "path": "docs/01 Problema/Supuestos y alcance.md", "group": "01 Problema", "tags": ["problema"], "meta": {}, "md": "# Supuestos y alcance\n\n> [!note] Los supuestos marcados con ❓ se confirman o descartan con un experimento y se registran en el [[Log de experimentos]].\n\n## Supuestos\n| # | Supuesto | Por qué lo asumimos | Qué pasa si es falso |\n|---|---|---|---|\n| S1 ✅ | El servicio es HTTP, con mensajes en `POST /msg` | **Confirmado por el README** | — |\n| S2 ✅ | Tiene **estado** (cuentas, saldos, operaciones) | README + ejemplos (IDs secuenciales, saldos) | — |\n| S3 ✅ | El set evalúa **secuencias** desde `/__reset` (40 de 1 request, 45 de 2–5, 15 de 6–12) | README | — |\n| S4 ❓ | Determinista tras un reset (IDs secuenciales `AC-0001`, `OP-0001`; sin timestamps) | Ejemplos | Si hay aleatoriedad, esos tests son imposibles de igualar; se documenta como riesgo |\n| S5 ❓ | `/__reset` sin token o con un token ajeno devuelve un error de auth del original | El contrato pide \"responder como el original\" | Se mide en vivo y se copia tal cual |\n| S6 ❓ | El reemplazo solo necesita **un** estado (el del token del equipo); cualquier otro token o la falta de token se responde como lo haría el original con un token inválido | El set usa el token del equipo; el original separa el estado por token | Si el set usara varios tokens válidos, habría que separar el estado por token (cambio pequeño: un dict de estados) |\n| S7 ✅ | **Los headers no se comparan**; el body JSON se compara sin importar el orden de las claves | README | — |\n| S8 ❓ | El control es una función determinista solo del contenido del mensaje (sin estado ni token) | Mismo mensaje → mismo control en #5 y #11 | Si dependiera del estado, la integridad sería parte de la memoria |\n| S9 | La versión de las 20:00 puede diferir de la de la mañana | README: \"el servicio puede cambiar durante el día\" | Re-grabar la regresión antes de las 20:00 y comparar con el corpus de la mañana ([[ADR-003]]) |\n| S10 | Lo que el reemplazo no sepa responder recibe un default explícito, documentado como `supuesto` en la spec | README lo pide | — |\n\n## Dentro del alcance\n- Todos los métodos, rutas (existentes e inexistentes), headers y cuerpos que el original acepte o rechace.\n- Errores: status, body, `Content-Type` y formato exactos.\n- Comportamiento con estado entre requests desde un `/__reset`.\n- Spec y log de experimentos respaldados con evidencia.\n\n## Fuera del alcance\n| Qué dejamos fuera | Razón |\n|---|---|\n| Igualar latencia y tiempos de respuesta | No es comportamiento funcional; solo hay que responder en < 5 s por paso |\n| Igualar headers (incluido `X-Req`) | El set **no compara headers** (README). `X-Req` se registra en el log, pero no se persigue en el reemplazo salvo que sea trivial |\n| Usar un LLM dentro del reemplazo | Está permitido, pero el servicio es determinista y basado en reglas: un LLM agrega latencia y no determinismo sin aportar paridad |\n| Persistencia entre reinicios del servidor | El evaluador llama `/__reset` antes de cada test; el estado durable no aporta |\n| Escalado horizontal / alta disponibilidad | Una sola instancia evita inconsistencias de estado; la carga del evaluador es baja |\n| Reproducir bugs que dependen de concurrencia real | Difíciles de observar con certeza en 8 h; se documentan como hipótesis si aparecen |\n\nRelacionado: [[Casos difíciles]] · [[Brief]]\n", "mtime": "2026-10-10 09:50"}, {"id": "02-arquitectura-arquitectura", "title": "Arquitectura", "path": "docs/02 Arquitectura/Arquitectura.md", "group": "02 Arquitectura", "tags": ["arquitectura"], "meta": {}, "md": "# Arquitectura\n\n> [!info] Dos sistemas\n> **A. Banco de pruebas (local):** descubre el comportamiento del original y genera evidencia.\n> **B. Reemplazo (desplegado):** reproduce ese comportamiento sin hablar nunca con el original.\n> Lo único que los conecta es el **corpus** de request/response grabados y la **spec**.\n\n## Diagrama\n```mermaid\nflowchart LR\n    subgraph A[\"A · Banco de pruebas (local, scripts propios)\"]\n        F[Fuzzer de secuencias<br/>rutas · métodos · auth · cuerpos] --> P[Prober<br/>reset → secuencia → graba]\n        P -->|HTTP| O[(Servicio original)]\n        P --> C[(Corpus JSONL<br/>request + response<br/>versionado)]\n        C --> L[Log de experimentos]\n        C --> S[Especificación]\n    end\n\n    subgraph B[\"B · Reemplazo (desplegado, 1 instancia)\"]\n        G[Catch-all HTTP<br/>sin routing del framework] --> AU[Capa de auth<br/>token del equipo · /health · /__reset]\n        AU --> R[Router propio<br/>rutas descubiertas + 404 del original]\n        R --> H[Handlers<br/>lógica + errores exactos]\n        H <--> ST[(Estado en memoria<br/>reset = estado inicial)]\n        H --> SE[Serializador exacto<br/>status · headers · bytes]\n    end\n\n    S -.guía la implementación.-> H\n    C --> D[Tester diferencial<br/>replay del corpus contra B<br/>→ % paridad]\n    D -->|HTTP| G\n    EV[Set oculto del jurado] -->|Bearer token| G\n```\n\n## Componentes\n| Componente | Responsabilidad | Tecnología | Decisión |\n|---|---|---|---|\n| Fuzzer | Genera secuencias de requests: wordlist de rutas, todos los métodos, variantes de auth, mutaciones de cuerpo, valores frontera | Python + `httpx` | [[ADR-003]] |\n| Prober | `reset` → ejecuta la secuencia → graba cada par request/response al corpus | Python | [[ADR-003]] |\n| Corpus | Fuente de verdad del comportamiento observado; versionado en git (detecta el incidente por diff) | JSONL | [[ADR-003]] |\n| Catch-all HTTP | Recibe **cualquier** request sin que el framework responda por su cuenta | Por decidir | [[ADR-001]] |\n| Capa de auth | Token del equipo → habilita `/health` y `/__reset`; cualquier otra variante → se comporta como el original | — | [[ADR-001]] |\n| Estado | Store en memoria con snapshot inicial; `/__reset` lo restaura | dict en memoria | [[ADR-002]] |\n| Serializador exacto | Escribe bytes, status y `Content-Type` tal como los envía el original | — | [[ADR-001]] |\n| Tester diferencial | Reproduce el corpus contra el reemplazo y compara → métricas de [[Plan de evaluación]] | Python | [[ADR-003]] |\n| Despliegue | URL pública estable desde las 20:00 hasta el final del demo day, sin cold starts | Por decidir | [[ADR-004]] |\n\n## Flujo\n1. **Descubrir:** fuzzer → prober → original → corpus.\n2. **Entender:** leer el corpus → hipótesis → experimento dirigido → regla en la [[Especificación]] + entrada en el [[Log de experimentos]].\n3. **Reproducir:** implementar la regla en el reemplazo.\n4. **Verificar:** el tester diferencial reproduce el corpus contra el reemplazo → % de paridad. Lo que falla es el próximo experimento.\n5. **Repetir** hasta las ~18:00; después congelar y endurecer.\n\n## Cómo absorbe cambios (incidente)\n- El corpus está versionado: si el original cambia, re-correr el prober y hacer `diff` contra el corpus anterior muestra exactamente qué cambió.\n- El tester diferencial dice qué partes del reemplazo dejaron de coincidir.\n- Las reglas están aisladas por handler: un cambio de comportamiento toca un módulo.\n- Token, puerto y flags van en variables de entorno, no en el código.\n\nTodas las decisiones: [[Decisiones]]\n", "mtime": "2026-10-10 09:48"}, {"id": "02-arquitectura-decisiones-adr-001", "title": "ADR-001", "path": "docs/02 Arquitectura/Decisiones/ADR-001.md", "group": "02 Arquitectura / Decisiones", "tags": ["decision"], "meta": {"estado": "propuesta", "fecha": "2026-10-10"}, "md": "# ADR-001 — Catch-all HTTP de bajo nivel en vez de routing de framework\n\n## Contexto\nEl reemplazo debe responder **exactamente** como el original, incluidas las rutas inexistentes, los métodos no permitidos y los errores de validación. Los frameworks web modernos responden por su cuenta en esos casos: 404/405 con su propio formato, redirects por la `/` final, 422 de validación automática, manejo implícito de `HEAD`/`OPTIONS`, y headers y serialización JSON propios.\n\n## Decisión\nUn **único handler catch-all** que recibe todo (cualquier método y ruta) y un **router propio** que decide cada respuesta. Escribimos status, headers y **bytes** del body a mano. Sin validación automática ni serialización implícita.\n\nLenguaje: **por decidir** → opciones abajo.\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| FastAPI/Express con rutas declarativas y validación de modelos | Generan respuestas que no controlamos (422, 404 y 405 propios, orden de claves, espacios). Cada una sería un punto de no-paridad que hay que parchear |\n| Proxy o grabación con replay literal (devolver la respuesta grabada más parecida) | No generaliza a entradas no vistas ni a estado nuevo; el set oculto \"corre sobre algo que no han visto\" |\n\n## Opciones de lenguaje\n| Opción | A favor | En contra |\n|---|---|---|\n| **Python + Starlette/ASGI crudo** (o `aiohttp` low-level) | Mismo lenguaje que el banco de pruebas; iteración rápida | Hay que desactivar con cuidado las respuestas automáticas |\n| **Node + `http` nativo** | Control total del byte; sin magia | Dos lenguajes en el repo |\n| **Go `net/http`** | Control total, binario único, despliegue simple | Iteración más lenta en 8 h |\n\n## Actualización con el README\nEl set **no compara headers** y compara JSON **sin importar el orden de las claves**. Eso baja el riesgo de la serialización: basta con un JSON correcto, sin igualar byte a byte. Sigue siendo crítico controlar **status + body** de las rutas inexistentes, los métodos no permitidos y los cuerpos que no son JSON (ahí se compara el texto exacto). La decisión del catch-all se mantiene; la del serializador manual se relaja.\n\n## Consecuencias\n- **Ganamos:** control total de la paridad; ningún comportamiento \"regalado\" por el framework.\n- **Perdemos / riesgos:** más código manual (parseo de body, routing). Hay que probar que el servidor HTTP subyacente no altere los headers.\n- **Cómo lo medimos:** paridad en las categorías 404/405/body malformado del [[Plan de evaluación]].\n", "mtime": "2026-10-10 09:51"}, {"id": "02-arquitectura-decisiones-adr-002", "title": "ADR-002", "path": "docs/02 Arquitectura/Decisiones/ADR-002.md", "group": "02 Arquitectura / Decisiones", "tags": ["decision"], "meta": {"estado": "propuesta", "fecha": "2026-10-10"}, "md": "# ADR-002 — Estado en memoria, una sola instancia\n\n## Contexto\nEl original tiene estado (existe `/__reset`). El evaluador llama `/__reset` antes de **cada** test, así que no necesitamos durabilidad entre tests. Sí necesitamos consistencia: dos requests seguidos deben ver el mismo estado.\n\n## Decisión\nEstado en **memoria del proceso**, con un snapshot del estado inicial que `/__reset` restaura (deep copy). **Una sola instancia y un solo worker.** Un lock alrededor de cada request para serializar el acceso.\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| Redis / Postgres / SQLite | Agrega latencia, infraestructura y un punto de falla, sin beneficio: el estado se reinicia en cada test |\n| Varias instancias con estado compartido | Varias instancias con estado local darían respuestas inconsistentes; compartirlo exige una base de datos (ver arriba). La carga del evaluador no lo justifica |\n\n## Consecuencias\n- **Ganamos:** simplicidad, latencia mínima, reset trivial y determinista.\n- **Perdemos / riesgos:** si el hosting reinicia el proceso, el estado se pierde (aceptable: el test empieza con reset). Hay que **fijar 1 instancia y 1 worker** en el hosting; un autoscaling silencioso rompería la paridad.\n- **Cómo lo medimos:** tests de secuencia (T-seq-*) en el [[Plan de evaluación]].\n", "mtime": "2026-10-10 09:48"}, {"id": "02-arquitectura-decisiones-adr-003", "title": "ADR-003", "path": "docs/02 Arquitectura/Decisiones/ADR-003.md", "group": "02 Arquitectura / Decisiones", "tags": ["decision"], "meta": {"estado": "propuesta", "fecha": "2026-10-10"}, "md": "# ADR-003 — Corpus grabado + tester diferencial como columna vertebral\n\n## Contexto\nHay que entender un servicio sin documentación, demostrar con evidencia cada regla de la spec, llevar un log de experimentos y saber en todo momento qué tan parecido es el reemplazo. Además, a mitad del día habrá un incidente que puede cambiar el comportamiento.\n\n## Decisión\nTodo sondeo al original pasa por un **prober propio** que hace `reset` → secuencia → y graba cada request/response en un **corpus JSONL versionado**. Un **tester diferencial** reproduce las mismas secuencias contra el reemplazo y compara. El corpus se divide en:\n- **Desarrollo:** lo que vemos para escribir la spec.\n- **Hold-out:** secuencias generadas con otra semilla del fuzzer que **no miramos**; simulan el set oculto.\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| Exploración manual con curl/Postman | Sin rastro reproducible: no alimenta el log ni la spec, y no sirve para regresiones ni para detectar el incidente |\n| Herramientas que generan specs o clones automáticamente | Prohibidas por las reglas (\"hacen el trabajo por ti\"). Fuzzer y scripts propios sí están permitidos |\n| Medir solo con el corpus de desarrollo | Sobreajuste: el set oculto corre sobre algo que no hemos visto. El hold-out estima la generalización |\n\n## Consecuencias\n- **Ganamos:** cada regla tiene evidencia; métrica de paridad continua; detección del incidente por diff; el log de experimentos se escribe solo.\n- **Perdemos / riesgos:** cuesta construir el banco de pruebas antes de ver resultados (~1 h). Si el original tiene rate limit, hay que dosificar el fuzzing.\n- **Cómo lo medimos:** es el propio mecanismo de medición → [[Plan de evaluación]].\n", "mtime": "2026-10-10 09:48"}, {"id": "02-arquitectura-decisiones-adr-004", "title": "ADR-004", "path": "docs/02 Arquitectura/Decisiones/ADR-004.md", "group": "02 Arquitectura / Decisiones", "tags": ["decision"], "meta": {"estado": "aceptada", "fecha": "2026-10-10"}, "md": "# ADR-004 — Railway siempre encendido, una réplica, healthcheck por Host\n\n## Contexto\nEl entrypoint debe estar accesible desde internet **desde las 20:00 hasta el final del demo day**, con `GET /health` y el token del equipo. El estado vive en memoria ([[ADR-002]]), así que necesitamos exactamente una instancia, sin cold starts ni suspensión por inactividad.\n\nRailway verifica el healthcheck **solo durante el deploy**: lo llama **sin token**, desde el host `healthcheck.railway.app`, y exige un 2xx. Pero el original responde `401 E001` a `/health` sin token (log #2), y el reemplazo debe responder igual. Si el healthcheck se configura sin más, el deploy falla.\n\n## Decisión\n- **Railway**, con `numReplicas: 1` y **Serverless apagado**, configurado en `railway.json`. Uvicorn con `--workers 1`.\n- **Healthcheck:** `GET /health` responde `200 {\"ok\":true}` sin token **solo si** `Host == healthcheck.railway.app`. Con cualquier otro Host se aplica el comportamiento del original (`401 E001` sin token).\n- Secretos (`TEAM_TOKEN`) en las variables de entorno de Railway.\n\n## Alternativas descartadas\n| Alternativa | Por qué la descartamos |\n|---|---|\n| Agregar `/healthz` sin auth | Toda ruta extra rompe la paridad: en el original debe dar `404 E404` |\n| No configurar el healthcheck | Railway no sabría cuándo está listo cada deploy; un deploy roto quedaría activo sin aviso |\n| `/health` sin token siempre 200 | Rompe la paridad con el original (`401 E001`, log #2) |\n| Serverless de Railway / Lambda / Cloud Run escalando a 0 | El estado en memoria no sobrevive y el primer request al despertar puede dar 502 |\n| Render o Fly.io | Render gratis se duerme (cold start contra el límite de 5 s); Fly pide más configuración sin ganancia frente a Railway, donde ya corre el original |\n\n## Consecuencias\n- **Ganamos:** deploys verificados automáticamente sin tocar la paridad. El jurado nunca usa ese Host.\n- **Riesgo:** un cliente podría falsificar el header `Host` para obtener el 200. Se acepta: la respuesta no expone nada (`{\"ok\":true}`). Va documentado en *Riesgos* de la spec.\n- **Desplegar temprano** (antes de las 13:00 un esqueleto con `/health`) para descubrir problemas del proxy.\n- Después de cada deploy, smoke test contra la URL pública **con** el token del equipo, y el tester diferencial también contra la URL desplegada.\n", "mtime": "2026-10-10 10:30"}, {"id": "02-arquitectura-decisiones", "title": "Decisiones", "path": "docs/02 Arquitectura/Decisiones.md", "group": "02 Arquitectura", "tags": ["arquitectura", "moc"], "meta": {}, "md": "# Registro de decisiones\n\n> [!tip] Regla de la rúbrica\n> Cada decisión dice qué alternativa descartó y por qué. Para una decisión nueva, crea una nota en `Decisiones/` con la plantilla [[Plantillas/Decisión]].\n\n| ID | Decisión | Elegido | Descartado | Estado |\n|---|---|---|---|---|\n| [[ADR-001]] | Núcleo HTTP | Catch-all ASGI puro sobre uvicorn `--workers 1 --no-server-header` + `try/except` global (nunca el 500 de uvicorn) | FastAPI, router de Starlette, aiohttp, `http.server` | aceptada |\n| [[ADR-002]] | Dónde vive el estado | Memoria detrás del puerto `StateRepository`, separado por token; reset = función de estado inicial (IDs incluidos) | Redis/Postgres desplegado; `deepcopy`; contadores globales | aceptada |\n| [[ADR-003]] | Cómo descubrimos y verificamos el comportamiento | Prober con log + ajuste offline + validación predictiva + replay diferencial | curl/Postman manual; herramientas automáticas | aplicada |\n| [[ADR-004]] | Hosting | Railway, siempre encendido, 1 réplica; `/health` 200 sin token solo con `Host: healthcheck.railway.app` | Serverless; planes que se duermen; ruta `/healthz` extra | aceptada |\n| ADR-005 | Lenguaje | Python 3.10 en el banco y en el reemplazo | Node / Go | aceptada |\n| ADR-006 | Entradas desconocidas | Default explícito marcado `supuesto` | Adivinar en silencio / fallback a LLM | aceptada |\n| ADR-007 | Confianza en la spec | `confirmado` solo con ≥ 2 repeticiones o una predicción sobre entrada no vista | Confirmar lo visto una sola vez | aplicada |\n| ADR-008 | Estructura interna | Hexagonal mínima: adaptador HTTP → pipeline → registro → dominio puro → puertos | `app.py` monolítico con `if/elif`; Clean Architecture completa | aceptada |\n| ADR-009 | Errores y precedencia | Catálogo de errores como datos (código, status, cuerpo exacto, etapa) + pipeline con orden declarado; los handlers lanzan `DomainError(code)` | `if` anidados con strings dispersos; validación con Pydantic | aceptada |\n| ADR-010 | Comandos | Registro nombre → handler + aridad (un módulo por comando) | Dispatcher `if cmd == ...` | aceptada |\n| ADR-011 | Cambio de las 15:30 | Perfiles heredables `BEHAVIOR_PROFILE=v1\\|v2` (base + overrides) con goldens por perfil | Editar reglas en el sitio; flags `if INCIDENT`; ramas de git | aceptada |\n| ADR-012 | Escalabilidad | App sin estado propio detrás del puerto; **1 réplica a propósito**; escalar = store compartido (Redis) particionado por token | Varias réplicas en memoria; Redis desde el día 1 | aceptada |\n| ADR-013 | Anti-sobreajuste | Tester diferencial con hold-out (otra semilla); alarma si dev − hold-out ≥ 5 pts | Medir solo en dev o solo con el resultado oficial | aceptada |\n| ADR-014 | Red de seguridad | Diferencial + goldens en pre-push, smoke post-deploy con token, logs JSON por request, secuencias centinela para la 15:30 | Tests manuales; OpenTelemetry/Prometheus | aceptada |\n\nInvestigación y fuentes: [[Investigación de arquitecturas]] · Entregables: `docs/entregables/`\n\nDetalle de las decisiones con su justificación: README del repo → *Decisiones de Diseño*.\n", "mtime": "2026-10-10 10:32"}, {"id": "02-arquitectura-investigación-de-arquitecturas", "title": "Investigación de arquitecturas", "path": "docs/02 Arquitectura/Investigación de arquitecturas.md", "group": "02 Arquitectura", "tags": ["arquitectura", "investigación"], "meta": {"fecha": "2026-10-10", "estado": "propuesta"}, "md": "# Investigación de arquitecturas\n\n> [!summary] Para qué sirve esta nota\n> Revisa patrones conocidos para **reemplazar un sistema legado de caja negra** y para **construir el reemplazo como un motor de reglas modular**. Cada área dice qué elegimos, qué descartamos y por qué, con fuentes. Alimenta [[Decisiones]] y [[Arquitectura]]. Va pensada para **8 horas de construcción**: lo que sobra se marca como **overkill**.\n\n---\n\n## 0 · Recomendación ejecutiva\n\n### La arquitectura objetivo en 10 puntos\n\n1. **Hexagonal (puertos y adaptadores) en 5 capas:** borde HTTP → aplicación → dominio puro → puertos → adaptadores de estado. Las dependencias apuntan siempre hacia el dominio. El dominio no importa nada de HTTP ni de uvicorn.\n2. **Borde HTTP = catch-all ASGI puro** sobre `uvicorn --workers 1`. Un solo `async def app(scope, receive, send)` recibe cualquier método y ruta. Ningún framework responde por nosotros: ni 404, ni 405, ni 422, ni redirects de `/` final. Se mantiene [[ADR-001]].\n3. **Pipeline de validación con precedencia explícita** (cadena de responsabilidad). Las etapas son `ruta → auth → cuerpo → integridad → sintaxis → existencia → negocio`. Cada etapa devuelve `Ok(ctx)` o `Err(código)`, y **el orden lo da una lista del perfil**, no el anidado de `if`s. Así, cambiar la precedencia entre E202 y E302 es cambiar una línea de datos.\n4. **Registro de comandos (patrón Command + registry):** `ALTA`, `CONSULTA`, `DEPOSITO`, `TRANSFER`, `ANULA` y `PING` son clases o funciones con la misma firma `(args, estado, ids) → Resultado`. Se registran en un diccionario `{nombre: handler}` con su aridad declarada. Un comando nuevo después de las 15:30 es **un archivo más**, sin tocar el dispatcher.\n5. **Dominio puro y determinista:** los handlers son funciones **síncronas** sin I/O, sin reloj y sin aleatoriedad. Reciben el estado y devuelven `(nuevo_estado, respuesta)`. El valor de control (ISO 7064 mod 97-10) vive en `checkval.py`, que es el mismo código que valida el banco de pruebas ([[ADR-005]]).\n6. **Catálogo de errores como datos:** `errors.py` (o un YAML del perfil) guarda `{código: (status, cuerpo exacto)}`. Los handlers solo lanzan `DomainError(\"E401\")` y el borde HTTP lo traduce. Ningún string de error aparece suelto en el código.\n7. **Perfiles de comportamiento versionados:** `profiles/v1_manana.py` y `profiles/v2_incidente.py` declaran el catálogo de errores, el orden del pipeline, los límites (montos, aridades), el algoritmo de control y los *overrides* de comandos. La variable `BEHAVIOR_PROFILE` elige uno, y por defecto rige el vigente a las 20:00. El incidente de las 15:30 se modela como un **perfil nuevo que hereda del anterior y solo sobrescribe lo que cambió**. El diff entre perfiles es, literalmente, la sección 6 de la spec.\n8. **Puerto `StateRepository` + `IdGenerator`**, con el estado **particionado por token**. Hoy el adaptador es `InMemoryRepository`: un `dict[token, Ledger]` con una *factory* del estado inicial, y `/__reset` llama `factory()` (más barato y seguro que `deepcopy`). Los IDs de cuentas y operaciones salen de contadores **dentro del estado**, así que el reset también los reinicia. Un adaptador Redis o Postgres queda **documentado, no construido**.\n9. **Despliegue: Railway, 1 réplica, *Serverless* apagado, healthcheck en `/health`, `uvicorn --workers 1 --no-server-header`.** La escalabilidad horizontal se defiende *en principio* (app sin estado + repositorio enchufable) y **se renuncia a ella a propósito** en el despliegue, porque el evaluador habla con un solo proceso ([[ADR-002]]).\n10. **Red de seguridad = tester diferencial + golden files + CI:** el corpus `experimentos.jsonl`, marcado por versión del servicio, se reproduce contra el reemplazo con el **mismo comparador del jurado**. Corre en un hook pre-push o en GitHub Actions. Los logs son JSON, una línea por request (`seq`, `cmd`, `etapa_que_cortó`, `código`, `ms`). El `/health` confirma el perfil activo solo por log, nunca en el cuerpo, porque el cuerpo se compara.\n\n### Diagrama de componentes (reemplazo)\n\nLas capas van de arriba abajo. Cada flecha solo baja una capa y ninguna cruza otra. La línea punteada es un adaptador futuro, no construido.\n\n```mermaid\n---\nconfig:\n  layout: elk\n---\nflowchart LR\n    JUDGE([\"Set oculto del jurado · Bearer token\"])\n\n    subgraph L1[\"1 · Borde HTTP · adaptador de entrada\"]\n        direction TB\n        ASGI[\"app.py<br/>catch-all ASGI<br/>uvicorn · 1 worker\"]\n        CODEC[\"http_codec.py<br/>leer body · JSON exacto<br/>DomainError → status + cuerpo\"]\n        ASGI --> CODEC\n    end\n\n    subgraph L2[\"2 · Aplicación\"]\n        direction TB\n        PROF[\"profiles/<br/>v1_manana · v2_incidente<br/>elegido por BEHAVIOR_PROFILE\"]\n        PIPE[\"pipeline.py<br/>etapas en orden del perfil<br/>ruta → auth → cuerpo → control<br/>→ sintaxis → existencia → negocio\"]\n        REG[\"registry.py<br/>nombre → handler + aridad\"]\n        PROF --> PIPE\n        PIPE --> REG\n    end\n\n    subgraph L3[\"3 · Dominio puro · sin I/O\"]\n        direction TB\n        CHK[\"checkval.py<br/>ISO 7064 mod 97-10\"]\n        ERR[\"errors.py<br/>catálogo E001…E507\"]\n        CMDS[\"commands/<br/>ALTA · CONSULTA · DEPOSITO<br/>TRANSFER · ANULA · PING\"]\n    end\n\n    subgraph L4[\"4 · Puertos\"]\n        direction TB\n        REPO[\"StateRepository<br/>get · put · reset por token\"]\n        IDS[\"IdGenerator<br/>contadores dentro del estado\"]\n    end\n\n    subgraph L5[\"5 · Adaptadores de salida\"]\n        direction TB\n        MEM[(\"InMemoryRepository<br/>dict por token · factory inicial\")]\n        RED[(\"Redis / Postgres<br/>futuro · no construido\")]\n    end\n\n    JUDGE --> ASGI\n    CODEC --> PIPE\n    PIPE --> CHK\n    PIPE --> ERR\n    REG --> CMDS\n    CMDS --> REPO\n    CMDS --> IDS\n    REPO --> MEM\n    REPO -.-> RED\n```\n\n### Diagrama de la red de seguridad (banco + CI)\n\n```mermaid\n---\nconfig:\n  layout: elk\n---\nflowchart TB\n    PRB[\"prober.py<br/>reset → secuencia → graba\"] --> LOG[(\"experimentos.jsonl<br/>marcado v1 / v2 por hora\")]\n    LOG --> GOLD[\"golden/*.jsonl<br/>secuencias congeladas por perfil\"]\n    GOLD --> DIFF[\"diff.py<br/>comparador del jurado\"]\n    DIFF --> CI[\"CI · pre-push / GitHub Actions<br/>falla si baja la paridad\"]\n```\n\n---\n\n## 1 · Patrones para reemplazar un sistema legado de caja negra\n\n| Patrón | Qué es | ¿Aplica aquí? | Veredicto |\n|---|---|---|---|\n| **Strangler Fig** | Poner una fachada delante del legado y redirigir rutas al sistema nuevo una por una hasta \"estrangular\" el viejo ([Fowler](https://martinfowler.com/bliki/StranglerFigApplication.html)) | No hay migración gradual: el jurado habla **solo** con el reemplazo, y el reemplazo **no puede llamar** al original | **Descartado** como mecanismo. Lo citamos como el patrón \"de producción\" que usaríamos fuera del reto |\n| **Parallel run / shadow traffic** | Mandar el mismo tráfico a viejo y nuevo y comparar: [GitHub Scientist](https://github.com/github/scientist), [Twitter Diffy](https://github.com/opendiffy/diffy), [GoReplay](https://github.com/buger/goreplay) | El reemplazo no puede llamar al original. Pero **el banco de pruebas sí puede** mandar la misma secuencia a ambos | **Adoptado en versión offline:** `diff.py` repite cada secuencia grabada contra el reemplazo. Es Scientist con el \"control\" grabado en vez de vivo |\n| **Characterization / golden master / approval testing** | Fijar con tests lo que el sistema *hace hoy*, no lo que \"debería\" hacer (Feathers, *Working Effectively with Legacy Code*; [ApprovalTests](https://approvaltests.com/)) | Es exactamente el criterio del jurado: igualar status y cuerpo, errores incluidos | **Adoptado:** cada línea del log es un golden. Se congelan en `golden/<perfil>.jsonl` |\n| **Differential testing** | Dos implementaciones, misma entrada, comparar salidas ([McKeeman 1998](https://www.cs.dartmouth.edu/~mckeeman/references/DifferentialTestingForSoftware.pdf)) | Es el núcleo de [[ADR-003]] | **Adoptado** (ya aplicado) |\n| **Record / replay** | Grabar el tráfico y reproducirlo (VCR.py, GoReplay) | Útil como test, **inútil como implementación**: no generaliza a entradas ni estados nuevos | **Adoptado solo como test.** Como reemplazo, descartado ([[ADR-001]]) |\n| **Contract testing (Pact)** | El consumidor publica expectativas y el proveedor las verifica ([docs.pact.io](https://docs.pact.io/)) | Supone un consumidor conocido y negociación de contrato. Aquí el \"contrato\" es el comportamiento observado | **Overkill.** Nuestro corpus JSONL ya *es* el contrato, sin el broker |\n| **Model-based / property-based (Hypothesis stateful)** | Una máquina de estados genera secuencias de comandos y compara contra un modelo ([Hypothesis stateful](https://hypothesis.readthedocs.io/en/latest/stateful.html)) | Muy útil **contra nuestro propio reemplazo** para invariantes: el saldo nunca es negativo, `ANULA` deshace `TRANSFER`, `reset` deja todo igual, aridad × control | **Adoptado parcialmente, después de las 17:00 si sobra tiempo.** Contra el original no: consume el presupuesto de requests y no deja hipótesis por línea |\n| **Inferencia de autómatas (L\\*, LearnLib)** | Aprender activamente una máquina de Mealy con *membership* y *equivalence queries* ([Angluin 1987](https://doi.org/10.1016/0890-5401(87)90052-6), [LearnLib](https://learnlib.de/)) | El espacio de entrada es enorme (montos, IDs, control) y la máquina depende de datos, no es de estados finitos chica. Necesita JVM y abstracción de alfabeto | **Overkill para 8 h.** Tomamos la idea: un alfabeto abstracto de comandos (`ALTA_ok`, `DEP_ok`, `DEP_sin_saldo`…) para diseñar secuencias |\n| **Fuzzing basado en gramáticas** | Generar entradas desde una gramática del protocolo ([The Fuzzing Book](https://www.fuzzingbook.org/html/Grammars.html)) | El formato `CMD;args;CONTROL` es una gramática trivial. Generar mensajes **con control válido** es clave para pasar la barrera E201/E202 | **Adoptado, liviano:** un generador propio de ~40 líneas que arma `CMD;args` y calcula el control con `checkval.py`. Mutaciones dirigidas: control ±1, aridad ±1, montos frontera |\n\n**Lo que elegimos:** *characterization + differential offline + gramática liviana*.\n**Lo que descartamos:** Strangler Fig y shadow traffic en vivo (prohibido llamar al original), Pact (sin consumidor real), L\\*/LearnLib (costo de montaje frente a 8 h).\n\n---\n\n## 2 · El reemplazo como motor de reglas modular\n\n### 2.1 Estructura: hexagonal\n\n| Opción | A favor | En contra | Veredicto |\n|---|---|---|---|\n| **Hexagonal / puertos y adaptadores** ([Cockburn](https://alistair.cockburn.us/hexagonal-architecture/)) | El dominio se prueba sin HTTP; el estado se cambia de adaptador sin tocar reglas; las fronteras son defendibles en el debrief | Algo más de archivos | **Elegido**, en versión mínima: 2 puertos (`StateRepository`, `IdGenerator`) |\n| Clean Architecture completa (use cases, presenters, DTOs por capa) | Ortodoxa | Ceremonia sin beneficio en un servicio de 6 comandos | **Descartado (overkill)** |\n| Un solo `app.py` con `if/elif` | Rápido de escribir | La precedencia de errores queda implícita en el anidado; el incidente obliga a reescribir | **Descartado**: es el anti-patrón que el pipeline resuelve |\n\n### 2.2 Validación: pipeline con precedencia explícita\n\n- **Patrón:** cadena de responsabilidad ([refactoring.guru](https://refactoring.guru/design-patterns/chain-of-responsibility)) en su forma funcional: `STAGES = [route, auth, body, control_format, control_value, syntax, existence, business]`. Se recorre la lista y **gana el primer error**.\n- **Por qué importa:** el jurado tiene casos de *dos defectos por mensaje* (ver [[Plan de evaluación]]). La precedencia observada (E404 antes de E001, control antes de aridad) es justo lo que el incidente puede cambiar. Si el orden es una lista del perfil, el cambio es un *diff* de una línea, auditable y citado en la spec.\n- **Descartado:** validación declarativa con Pydantic. Valida todo el modelo, acumula errores y su orden no es el nuestro. Además genera 422 propios ([FastAPI · handling errors](https://fastapi.tiangolo.com/tutorial/handling-errors/)).\n\n### 2.3 Comandos: Command + registry\n\n```python\n@command(\"TRANSFER\", arity=3)\ndef transfer(args, st: Ledger, ids: IdGenerator) -> Result: ...\n```\n- El `registry` resuelve el nombre, chequea aridad (E301/E302) y despacha.\n- **Descartado:** jerarquías de clases con herencia profunda. Con funciones registradas alcanza, y es más fácil sobrescribir una en un perfil.\n\n### 2.4 Perfiles de comportamiento (versionado)\n\n| Opción | Veredicto |\n|---|---|\n| **Perfil como módulo Python que hereda del anterior** (`V2 = V1.override(errors={...}, stages=[...], commands={\"ANULA\": anula_v2})`) | **Elegido.** Es tipado, ejecutable y el diff es legible |\n| Perfil 100 % YAML / JSON | Descartado: el algoritmo de control y la lógica de un comando no son datos. Usaríamos YAML solo para el catálogo de errores si crece |\n| *Feature flags* sueltos (`if INCIDENT:`) | Descartado: se esparcen por el código y no dejan una lista cerrada de \"qué cambió\" |\n| Rama git por versión | Descartado: duplica el código y no permite correr el diferencial de **ambas** versiones en el mismo CI |\n\n**Regla operativa:** el corpus se marca con `version` según la hora del request (antes o después de las 15:30, confirmado por diff). `diff.py --profile v1` compara contra goldens v1 y `--profile v2` contra v2. Desplegamos con `BEHAVIOR_PROFILE=v2`.\n\n### 2.5 Catálogo de errores como datos\n\n- `errors.py`: `CATALOG = {\"E001\": (401, {\"error\": \"E001\", \"mensaje\": \"no autorizado\"}), ...}`.\n- Los handlers lanzan `DomainError(code)` y solo el borde arma la respuesta. **Un único lugar** para cada string exacto; la spec (sección 5) se genera o verifica desde este dict.\n\n### 2.6 Determinismo e IDs\n\n- Los contadores de cuenta y de operación viven **dentro del `Ledger`**, nunca como globales del módulo. Así `/__reset` los devuelve al inicio sin código extra.\n- Prohibido `uuid4`, `random` y `time.time()` en el dominio. Si el original muestra fechas o IDs aleatorios, se inyecta un puerto `Clock` o `Rng` con semilla fija y se anota como `supuesto`.\n- El reset usa `state_factory()` en vez de `deepcopy(snapshot)`. Es más rápido, no comparte referencias por accidente y obliga a escribir el estado inicial de forma explícita.\n\n### 2.7 Concurrencia\n\n- Uvicorn corre **un** event loop. Si los handlers del dominio son **síncronos** y no hay `await` entre leer y escribir el estado, cada request es atómico sin lock. Dejamos un `asyncio.Lock` de todos modos: cuesta casi nada y protege si alguien agrega un `await`.\n- **Descartado:** `threading.Lock` con un servidor en hilos. No aplica a ASGI.\n\n---\n\n## 3 · Escalabilidad bien hecha (y por qué no la desplegamos)\n\n> [!warning] El trade-off, dicho sin rodeos\n> El set oculto le habla a **un solo proceso** y \"si tu plataforma levanta varias instancias, cada una tendrá su propio estado\". Escalar horizontalmente con estado local **rompe la paridad**. Por eso diseñamos para escalar y desplegamos sin escalar.\n\n| Pieza | Cómo escalaría en producción | Qué hacemos hoy |\n|---|---|---|\n| App | Sin estado: toda la memoria pasa por `StateRepository` | Igual: el código ya no guarda estado fuera del repositorio |\n| Estado | `RedisRepository`: un `HASH` por token, operaciones con `WATCH/MULTI` o script Lua para que `TRANSFER` sea atómico. O `PostgresRepository` con `SELECT … FOR UPDATE` y una fila por token ([Redis transactions](https://redis.io/docs/latest/develop/interact/transactions/)) | `InMemoryRepository`. El Redis queda como interfaz y nota de diseño, **no construido** |\n| Partición | **Por token** (cada token es un *tenant* aislado, como en el original). Permite *sharding* por hash del token y sticky routing | `dict[token, Ledger]`. Solo el token del equipo pasa auth, pero la partición es gratis y refleja el original |\n| Idempotencia | Clave de idempotencia por request para reintentos seguros en `DEPOSITO`/`TRANSFER` | **No se implementa:** el original no la tiene y agregarla cambiaría respuestas. Va a la sección 7 (Riesgos) de la spec como recomendación |\n| Réplicas | N réplicas detrás del balanceador + estado compartido | **1 réplica, 1 worker**, fijado en `railway.json` |\n\n**Por qué no Redis hoy:** agrega latencia de red, un servicio extra que puede caerse dentro de la ventana de 5 s y un punto de no-paridad en el reset, sin ningún test que lo premie. **El costo de renunciar:** el reemplazo no sobrevive a un reinicio con estado. Es aceptable, porque cada test empieza con `/__reset`.\n\n---\n\n## 4 · Núcleo HTTP en Python\n\n| Opción | Comportamientos por defecto que rompen la paridad | Veredicto |\n|---|---|---|\n| **ASGI crudo sobre uvicorn** | Casi ninguno. Uvicorn solo responde por su cuenta ante **HTTP malformado** (400 en texto plano) y en errores no capturados (500 `Internal Server Error`) ([uvicorn · server behavior](https://uvicorn.dev/server-behavior/)) | **Elegido.** Hay que envolver la app con un `try/except` que devuelva el error del original en vez del 500 de uvicorn |\n| Starlette | `Router` responde 404 `Not Found` en texto plano y 405 propios; `redirect_slashes=True` redirige `/msg/` → `/msg` con 307 ([Starlette routing](https://www.starlette.io/routing/)) | Aceptable **solo** con un `Mount`/ruta catch-all. Aporta poco frente a ASGI crudo |\n| FastAPI | Todo lo de Starlette más **422 automáticos** de validación con su propio JSON, `/docs`, `/openapi.json` y `/redoc` expuestos (¡rutas que deberían dar E404!), y `HEAD`/`OPTIONS` implícitos | **Descartado** |\n| aiohttp low-level (`web.Server(handler)`) | Bajo nivel y controlable; pero es otro servidor y otra API que aprender | Descartado: no gana nada sobre ASGI + uvicorn |\n| stdlib `http.server` | Hilos; respuestas de error HTML propias (`send_error`) para métodos desconocidos (501) | Descartado: frágil y lento de endurecer |\n\n**Settings de uvicorn:** `uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-server-header --proxy-headers --timeout-keep-alive 5`. Los headers no se comparan, pero `--no-server-header` evita filtrar el stack. **Nunca** `--reload` ni `--workers > 1`.\n\n**Detalles que hay que cuidar en el borde:**\n- Leer el body completo hasta `more_body=False` antes de decidir.\n- **Distinguir** body vacío, no-JSON, JSON sin `m` y `m` no-string. Cada uno puede tener un error distinto en el original: hay que sondearlos.\n- Serializar con `json.dumps(obj, ensure_ascii=False, separators=…)` igual al original **solo si** alguna respuesta no fuera JSON. Para JSON, el comparador ignora el orden de las claves.\n- Rutas: comparación exacta de `scope[\"path\"]` (sensible a mayúsculas y a `/` final, ya confirmado) y del método.\n\n### Railway\n\n| Ajuste | Valor | Por qué / fuente |\n|---|---|---|\n| Serverless (App Sleeping) | **Apagado** | Con *Serverless*, el servicio se duerme tras 10 min sin tráfico **saliente** y la primera request puede devolver **502** ([Railway · Serverless](https://docs.railway.com/reference/app-sleeping)) |\n| Réplicas | **1** | Varias réplicas = varios estados ([Railway · scaling](https://docs.railway.com/reference/scaling)) |\n| Healthcheck path | `/health` | Railway lo consulta **solo durante el deploy** y exige un **2xx**. Lo llama **sin token**, desde el hostname `healthcheck.railway.app` ([Railway · healthchecks](https://docs.railway.com/guides/healthchecks)). Nuestro `/health` sin token responde 401 (E001), igual que el original, así que el deploy fallaría. **Decisión:** en el borde, `GET /health` con `Host: healthcheck.railway.app` responde 200 `{\"ok\":true}`. El jurado nunca usa ese Host, así que la paridad no cambia. Gracias a esto el deploy no corta el servicio. Se anota como `supuesto` en Riesgos. **Alternativa más simple:** no configurar el healthcheck y validar a mano con el token tras cada deploy |\n| Config as code | `railway.json` con `startCommand`, `numReplicas: 1`, `sleepApplication: false` | Reproducible y revisable en el repo |\n| Variables | `TEAM_TOKEN`, `BEHAVIOR_PROFILE`, `LOG_LEVEL` | Nada sensible en el código |\n\n> [!danger] Trampa del healthcheck\n> No agregar una ruta como `/healthz` para Railway. El original responde **E404** a toda ruta desconocida, y el set \"incluye rutas que no existen\". Una ruta extra es un test perdido si el jurado la prueba.\n\n---\n\n## 5 · Observabilidad y red de seguridad para un build de 1 día\n\n| Herramienta | Qué hacemos | Overkill |\n|---|---|---|\n| **Logging estructurado** | Una línea JSON por request desde el borde: `{ts, method, path, cmd, stage_failed, code, status, ms, profile}`. Sin el token ni el cuerpo completo | OpenTelemetry, Prometheus, dashboards |\n| **Golden files** | `golden/v1.jsonl` y `golden/v2.jsonl` congelados desde el log; se regeneran solo a propósito | Snapshot testing con librerías externas |\n| **Diferencial en CI** | `python bench/diff.py --target local --profile v2` en un hook pre-push (ya existe `tools/install_hooks.py`) y opcionalmente GitHub Actions. Falla si la paridad baja respecto del último commit | Matriz de versiones de Python, contenedores de test |\n| **Smoke del deploy** | Tras cada deploy: `diff.py --target $URL` con 10 secuencias rápidas | Monitoreo sintético continuo |\n| **Tests de propiedades** | Hypothesis stateful contra el dominio puro (sin HTTP): invariantes de saldo, reset idempotente | Mutation testing |\n| **Detección del incidente** | A las 15:30+ re-correr un set fijo de \"secuencias centinela\" (~30 requests) y comparar contra `golden/v1`. Cada diferencia es una fila de la sección 6 de la spec | Detección continua por cron |\n\n---\n\n## 6 · Qué es overkill para 8 horas (resumen)\n\n- LearnLib / L\\* automático, Pact broker, Clean Architecture completa.\n- Construir el `RedisRepository` (basta la interfaz y la nota).\n- OpenTelemetry, métricas Prometheus, autoscaling.\n- Un DSL propio de reglas o un motor de reglas genérico (Drools-like): 6 comandos no lo justifican. El \"motor\" es la lista de etapas más el registro.\n- LLM dentro del reemplazo: permitido por las reglas, pero no determinista y con latencia. Ya está descartado en ADR-006.\n\n---\n\n## 7 · Cambios propuestos a las ADRs\n\n| ID | Decisión | Elegido | Descartado | Por qué |\n|---|---|---|---|---|\n| ADR-001 (enmienda) | Núcleo HTTP | ASGI crudo + uvicorn `--workers 1 --no-server-header` + `try/except` global que mapea excepciones al error del original | FastAPI (422, `/docs` y `/openapi.json` expuestos), Starlette Router (404/405 en texto plano, redirect de `/` final), aiohttp, `http.server` | Cada default del framework es una respuesta que no controlamos en las categorías que el set prueba |\n| ADR-002 (enmienda) | Estado | `StateRepository` con `InMemoryRepository`, particionado por token, reset por `factory()`, IDs dentro del estado | Redis/Postgres desplegado; `deepcopy` de snapshot; contadores globales | Diseño listo para escalar sin pagar latencia ni riesgo hoy; el reset reinicia también los IDs |\n| **ADR-008** (nueva) | Estructura del reemplazo | Hexagonal mínima: borde → aplicación → dominio puro → puertos → adaptadores | Un `app.py` monolítico con `if/elif`; Clean Architecture completa | El monolito oculta la precedencia y se rompe con el incidente; la Clean completa es ceremonia |\n| **ADR-009** (nueva) | Precedencia de errores | Pipeline de etapas con orden declarado en el perfil; gana el primer error | `if` anidados; validación declarativa (Pydantic) | El orden es un comportamiento evaluado (\"dos defectos por mensaje\") y puede cambiar en el incidente |\n| **ADR-010** (nueva) | Comandos | Registro `nombre → handler + aridad` (patrón Command) | Dispatcher con `if cmd == ...` | Un comando nuevo o cambiado es un archivo; la aridad queda declarada y comprobable |\n| **ADR-011** (nueva) | Versionado del comportamiento | Perfiles `v1_manana` / `v2_incidente` heredables, elegidos por `BEHAVIOR_PROFILE`; goldens por perfil | Flags `if INCIDENT` sueltos; rama git por versión; perfiles 100 % YAML | El diff entre perfiles **es** la sección 6 de la spec; permite correr ambos en CI y revertir con una variable |\n| **ADR-012** (nueva) | Errores | Catálogo como datos `{código: (status, cuerpo)}` + `DomainError(code)` | Strings de error en cada handler | Una sola fuente de verdad para los bytes exactos; la sección 5 de la spec se verifica contra él |\n| ADR-004 (enmienda) | Hosting | Railway, `numReplicas: 1`, Serverless apagado, `railway.json`, healthcheck en `/health` aceptado solo con `Host: healthcheck.railway.app` | Healthcheck en `/healthz`; Serverless encendido; deploy sin healthcheck | Serverless devuelve 502 al despertar; una ruta extra rompe la paridad de E404; `/health` exige token, y la excepción por Host no la ve el jurado |\n| **ADR-013** (nueva) | Red de seguridad | Diferencial + goldens por perfil en hook pre-push, smoke contra la URL tras cada deploy, logs JSON | Tests manuales; observabilidad completa (OTel/Prometheus) | Máximo de detección de regresiones con mínimo de montaje en 1 día |\n| ADR-003 (enmienda) | Descubrimiento | Se agregan un generador por gramática con control válido y las \"secuencias centinela\" para el incidente | L\\*/LearnLib; Pact; shadow traffic en vivo | L\\* es overkill en 8 h; Pact no tiene consumidor; el reemplazo no puede llamar al original |\n\n## Fuentes\n\n- Fowler, *StranglerFigApplication*: https://martinfowler.com/bliki/StranglerFigApplication.html\n- GitHub Scientist: https://github.com/github/scientist · Diffy: https://github.com/opendiffy/diffy · GoReplay: https://github.com/buger/goreplay\n- ApprovalTests: https://approvaltests.com/ · Feathers, *Working Effectively with Legacy Code* (2004), cap. 13 \"characterization tests\"\n- McKeeman, *Differential Testing for Software* (1998): https://www.cs.dartmouth.edu/~mckeeman/references/DifferentialTestingForSoftware.pdf\n- Pact: https://docs.pact.io/\n- Hypothesis stateful testing: https://hypothesis.readthedocs.io/en/latest/stateful.html\n- Angluin, *Learning regular sets from queries and counterexamples* (1987): https://doi.org/10.1016/0890-5401(87)90052-6 · LearnLib: https://learnlib.de/\n- The Fuzzing Book, *Grammars*: https://www.fuzzingbook.org/html/Grammars.html\n- Cockburn, *Hexagonal Architecture*: https://alistair.cockburn.us/hexagonal-architecture/\n- Chain of Responsibility: https://refactoring.guru/design-patterns/chain-of-responsibility\n- FastAPI, errores y 422: https://fastapi.tiangolo.com/tutorial/handling-errors/\n- Starlette routing: https://www.starlette.io/routing/\n- Uvicorn server behavior: https://uvicorn.dev/server-behavior/\n- Redis transactions: https://redis.io/docs/latest/develop/interact/transactions/\n- Railway: App Sleeping https://docs.railway.com/reference/app-sleeping · Healthchecks https://docs.railway.com/guides/healthchecks · Scaling https://docs.railway.com/reference/scaling\n", "mtime": "2026-10-10 10:27"}, {"id": "03-medición-plan-de-evaluación", "title": "Plan de evaluación", "path": "docs/03 Medición/Plan de evaluación.md", "group": "03 Medición", "tags": ["medicion"], "meta": {}, "md": "# Plan de evaluación\n\n> [!important] El set oculto llama `/__reset` y luego manda requests que compara contra el original. Nuestro tester diferencial hace lo mismo con el corpus grabado ([[ADR-003]]).\n\n## Unidad de prueba\nUn **caso** = `reset` + secuencia de N requests. Cada respuesta se compara contra la grabada del original.\n\n## Métricas\n> [!note] Comparador idéntico al del jurado (README)\n> Mismo status **y** mismo cuerpo. Si ambos cuerpos son JSON: el orden de las claves no importa, pero arrays, strings y números deben ser idénticos. Si alguno no es JSON: texto exacto. **Los headers no se comparan.** 5 s por paso.\n\n| Métrica | Definición exacta | Umbral objetivo |\n|---|---|---|\n| **Tests pasados (oficial)** | Los 100 tests del jurado, consultados en `/evento/resultados` | ≥ 90/100 |\n| **Paridad de casos (local)** | % de secuencias de nuestro corpus en las que **todas** las respuestas coinciden según el comparador del jurado | ≥ 90% en hold-out |\n| **Paridad de pasos** | % de respuestas individuales iguales | ≥ 97% |\n| **Paridad de status** | % de respuestas con el mismo código HTTP | ≥ 99% |\n| **Mezcla del jurado** | Paridad de casos ponderada como el set: 40% de 1 request, 45% de 2–5 y 15% de 6–12 | ≥ 90% |\n| **Brecha dev → hold-out** | Paridad en dev − paridad en hold-out | < 5 pts (si es mayor, estamos sobreajustando) |\n| **Cobertura** | Rutas, métodos y códigos de error distintos observados en el original y respaldados en la spec | Crece en cada iteración; reportar el número |\n| **Disponibilidad** | `/health` 200 y latencia p95 contra el despliegue | 200 siempre; p95 < 1 s (límite: 5 s) |\n| **Spec respaldada** | % de filas de la spec con al menos un `id` del log; afirmaciones `confirmado` sin repetición | 100% con evidencia; 0 afirmaciones sin probar marcadas `confirmado` |\n| **Presupuesto** | Requests usados del cupo de 8.000/día por token | < 6.000 antes de las 18:00 (reserva para revalidar el incidente) |\n\nTodas se reportan **desglosadas por categoría**: éxito · error de validación · auth · ruta inexistente · método no permitido · secuencia con estado.\n\n## Casos de prueba\n| ID | Tipo | Qué prueba | Viene de |\n|---|---|---|---|\n| T-health | contrato | `GET /health` con token → 200 | [[Brief]] |\n| T-reset | contrato | `POST /__reset` con token restaura el estado; con token ajeno o sin token responde como el original | [[Brief]], S5 |\n| T-404 | ruta inexistente | Rutas aleatorias, profundas, con caracteres raros | H1 |\n| T-405 | método | Cada método (GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS) en cada ruta conocida | H1 |\n| T-slash | formato de ruta | `/x` vs `/x/` vs `/X` vs `//x` vs query strings | H1 |\n| T-auth-* | auth | Sin header, `Bearer` vacío, token incorrecto, esquema en minúsculas, espacios extra | H4 |\n| T-body-* | validación | JSON inválido, vacío, tipos y campos incorrectos, `Content-Type` incorrecto | H5 |\n| T-edge-* | límites | Strings largos, números extremos, unicode, valores negativos y vacíos | H8 |\n| T-seq-* | estado | Crear → leer → modificar → borrar → leer; operaciones repetidas; orden alterado | H2 |\n| T-det | determinismo | Misma secuencia 2 veces tras reset → ¿respuestas idénticas? | H3 |\n| T-format | formato | Comparación byte a byte (espacios, orden de claves, salto de línea final) | H6 |\n\n## Cómo se corre\n```bash\npython -m bench.diff --target http://localhost:8000 --split holdout\n```\n\n## Resultados\n| Hora | Versión | Estricta | Status | Normalizada | Casos | Notas |\n|---|---|---|---|---|---|---|\n", "mtime": "2026-10-10 09:50"}, {"id": "04-ejecución-entrega", "title": "Entrega", "path": "docs/04 Ejecución/Entrega.md", "group": "04 Ejecución", "tags": ["ejecucion"], "meta": {"entrega": "20:00"}, "md": "# Entrega — 20:00\n\n- [ ] **Repo público**\n- [ ] **Servicio desplegado** y probado desde una máquina/red distinta\n- [ ] Entrypoint claro y documentado en el README\n- [ ] Corre contra el set de evaluaciones oculto (formato de entrada/salida verificado)\n- [ ] **Video de 2 minutos**\n- [ ] Resultados del [[Plan de evaluación]] actualizados\n- [ ] **Transcripts** de las sesiones con agentes → [[Reglas#Transcripts]]\n- [ ] Sin secretos en el repo; `.env.example` presente\n- [ ] *(Reto 2)* Especificación\n- [ ] *(Reto 2)* [[Log de experimentos]]\n\n## Entrypoint\n```bash\n# comando exacto\n```\n\n## URL del servicio\n-\n\n## Guion del video (2 min)\n1. Problema (15 s)\n2. Demo del servicio desplegado (60 s)\n3. Métricas y una decisión clave (30 s)\n4. Cómo absorbimos el [[Incidente]] (15 s)\n", "mtime": "2026-10-10 09:42"}, {"id": "04-ejecución-especificación", "title": "Especificación", "path": "docs/04 Ejecución/Especificación.md", "group": "04 Ejecución", "tags": ["ejecucion", "reto2", "entregable"], "meta": {"entrega": "20:00"}, "md": "# Especificación del servicio original\n\n> [!important] Formato obligatorio (README del material)\n> - Cada comportamiento tiene **ID · Comportamiento · Evidencia · Confianza**.\n> - **Evidencia** = los `id` de las líneas de `experimentos.jsonl` que lo prueban.\n> - **Confianza:** `confirmado` (probado y se repite) · `probable` (visto una vez o inferido) · `supuesto` (no probado; es lo que hace el reemplazo por defecto).\n> - El juez puntúa cada comportamiento bien descrito con evidencia. **Una afirmación falsa resta** → ante la duda, `probable` o `supuesto`, nunca `confirmado`.\n>\n> Versión entregable final: `spec/ESPECIFICACION.md` en el repo. Esta nota es el borrador de trabajo.\n\n## 1. Entrada\n_Rutas, métodos, autenticación, forma del cuerpo y límites._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| IN-01 | | | |\n\n## 2. Integridad\n_Cómo valida el servicio que un mensaje está bien formado (control)._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| INT-01 | | | |\n\n## 3. Comandos\n_Un bloque por comando: argumentos, efecto y respuesta._\n### PING\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### ALTA\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### CONSULTA\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### DEPOSITO\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### TRANSFER\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n### ANULA\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n\n## 4. Memoria entre requests\n_Qué recuerda el servicio y qué cambia una respuesta según los requests anteriores._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| MEM-01 | | | |\n\n## 5. Errores\n_Cada error con su status, su cuerpo exacto y el orden en que se evalúa frente a los demás._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| ERR-01 | | | |\n\n## 6. Cambios durante el día\n_Qué cambió, desde cuándo y cómo lo detectamos._ → [[Incidente]]\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n\n## 7. Riesgos\n_Comportamientos que un cliente nuevo no debería heredar y cómo los cerraríamos._\n| ID | Comportamiento | Evidencia | Confianza |\n|---|---|---|---|\n| RSK-01 | | | |\n", "mtime": "2026-10-10 09:50"}, {"id": "04-ejecución-incidente", "title": "Incidente", "path": "docs/04 Ejecución/Incidente.md", "group": "04 Ejecución", "tags": ["ejecucion", "incidente"], "meta": {}, "md": "# Incidente\n\n> [!warning] Llega a mitad del día y sin aviso. Esta nota se llena en el momento. Cómo respondemos también es material para el demo y el debrief.\n\n## Qué cambió\n- **Hora:**\n- **Descripción (tal como llegó):**\n\n## Impacto\n- **Qué componentes afecta:** → [[Arquitectura]]\n- **Qué supuestos rompe:** → [[Supuestos y alcance]]\n- **Evals antes del cambio:**\n- **Evals después del cambio (sin arreglar):**\n\n## Respuesta\n| Hora | Acción | Resultado |\n|---|---|---|\n| | | |\n\n## Decisiones tomadas\n- (crear ADR si aplica) → [[Decisiones]]\n\n## Evals después del arreglo\n| Métrica | Antes | Durante | Después |\n|---|---|---|---|\n\n## Lecciones\n-\n", "mtime": "2026-10-10 09:24"}, {"id": "04-ejecución-log-de-experimentos", "title": "Log de experimentos", "path": "docs/04 Ejecución/Log de experimentos.md", "group": "04 Ejecución", "tags": ["ejecucion", "reto2", "entregable"], "meta": {}, "md": "# Log de experimentos\n\n> [!important] Entregable: `experimentos.jsonl` en la raíz del repo, **una línea por cada request que le mandamos al original**, sin excepciones. Lo genera el prober automáticamente; nunca se escribe a mano.\n\n## Formato (README del material)\n```json\n{\"id\": 1, \"seq\": \"s1\", \"x_req\": 1, \"hipotesis\": \"PING responde sin estado\",\n \"request\": {\"m\": \"PING;XX\"}, \"status\": 200, \"response\": {\"pong\": true},\n \"conclusion\": \"responde pong aunque el último campo no sea un número\"}\n```\n| Campo | Qué es |\n|---|---|\n| `id` | Número de línea, único. **La spec cita estos números** |\n| `seq` | Secuencia. Todas sus líneas van después de un reset |\n| `x_req` | Valor del header `X-Req` de la respuesta |\n| `hipotesis` | Qué estábamos probando |\n| `request` / `status` / `response` | Lo enviado y lo recibido |\n| `conclusion` | Qué aprendimos (opcional) |\n\n## Reglas operativas\n- El prober **nunca** guarda el header `Authorization` (credenciales por persona, repo público).\n- Las respuestas con `X-Frontier-Infra: rate-limit` se marcan y **no** cuentan como comportamiento.\n- Cada experimento se lanza con una `hipotesis` explícita. Las `conclusion` se completan después.\n- Presupuesto: 8.000 req/día por token → usar un fuzzer dosificado, sin barridos ciegos.\n\n## Resumen por bloque (para el debrief)\n| Seq | Hora | Hipótesis | Requests | Conclusión |\n|---|---|---|---|---|\n| | | | | |\n\nBaseline y métricas: [[Plan de evaluación]]\n", "mtime": "2026-10-10 09:50"}, {"id": "05-demo-pitch", "title": "Pitch", "path": "docs/05 Demo/Pitch.md", "group": "05 Demo", "tags": ["demo"], "meta": {"entrega": "21:15"}, "md": "# Pitch — 21:15 (2 min + 2 min de preguntas)\n\n| Tiempo | Bloque | Contenido |\n|---|---|---|\n| 0:00–0:20 | Problema | 1 frase + por qué importa |\n| 0:20–1:00 | Qué construimos | demo o captura del servicio desplegado |\n| 1:00–1:30 | Cómo sabemos que funciona | métricas de [[Plan de evaluación]] |\n| 1:30–1:50 | Decisión más interesante / incidente | de [[Decisiones]] o [[Incidente]] |\n| 1:50–2:00 | Cierre | siguiente paso |\n\nPreparación para las preguntas: [[Preguntas probables]]\n", "mtime": "2026-10-10 09:42"}, {"id": "06-debrief-preguntas-probables", "title": "Preguntas probables", "path": "docs/06 Debrief/Preguntas probables.md", "group": "06 Debrief", "tags": ["debrief"], "meta": {}, "md": "# Preguntas probables (debrief de 10 min)\n\n| Pregunta | Respuesta corta | Nota de apoyo |\n|---|---|---|\n| ¿Por qué esta arquitectura y no otra? | | [[Decisiones]] |\n| ¿Qué falla y cómo lo sabes? | | [[Casos difíciles]] |\n| ¿Cómo mediste que funciona? | | [[Plan de evaluación]] |\n| ¿Qué harías con una semana más? | | [[Supuestos y alcance]] |\n", "mtime": "2026-10-10 09:17"}, {"id": "cronograma", "title": "Cronograma", "path": "docs/Cronograma.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Cronograma\n\n| Hora | Etapa | Entrega / evento | Nota |\n|---|---|---|---|\n| 10:10–10:30 | Elección de reto | Reto 2 (elegido a las 09:46) | [[Reto 2]] |\n| 10:30–**12:00** | Systems design | Doc de diseño de **una página** + diagrama | [[Doc de diseño]] · README del repo |\n| 12:00–**20:00** | Ejecución | Repo · entrypoint · video de 2 min · especificación · `experimentos.jsonl` | [[Entrega]] |\n| **15:30** | ⚠️ Incidente | El original cambia sin aviso | [[Incidente]] |\n| 20:00 | — | Los tokens de participante **dejan de funcionar** contra el original | todo grabado antes |\n| 20:00–21:00 | Debrief | 10 min con un juez. El set oculto se corre otra vez sobre la última entrega a tiempo | [[Preguntas probables]] |\n| 21:15–22:15 | Demo day | Pitch de 2 min + 2 min de preguntas | [[Pitch]] |\n| 22:15–23:00 | Premiación | — | — |\n\n> [!tip] Presupuesto de tiempo de la ejecución (12:00 → 20:00)\n> - **12:00–13:00:** esqueleto ASGI desplegado en Railway (`/health`, `/__reset`, 404, 401) + validar en `/evento`\n> - **13:00–15:00:** cerrar la fórmula del control; comandos + errores; `diff.py`; validar en `/evento` cada hora\n> - **15:00–15:30:** grabar el **corpus de regresión** completo (base para detectar el incidente)\n> - **15:30–17:00:** incidente: re-grabar, diff, ajustar; spec sección 6\n> - **17:00–18:30:** casos borde y precedencia de errores; spec completa\n> - **18:30–19:30:** congelar; re-grabar la regresión contra el original vigente; README + video\n> - **19:30–20:00:** entregar todo; verificar el entrypoint desde fuera\n", "mtime": "2026-10-10 10:09"}, {"id": "doc-de-diseño", "title": "Doc de diseño", "path": "docs/Doc de diseño.md", "group": "General", "tags": ["entregable"], "meta": {"entrega": "12:00"}, "md": "# Doc de diseño — _(nombre del sistema)_\n\n> [!warning] Entregable de **una página**. Esta nota es la versión final y resume el resto del vault: aquí solo va lo esencial y el detalle se queda en las notas enlazadas.\n\n## 1. Problema\n_(2–3 frases en nuestras palabras)_ ← [[Brief]]\n\n## 2. Supuestos y fuera de alcance\n- **Supuestos:** … (por qué) ← [[Supuestos y alcance]]\n- **Casos difíciles:** … ← [[Casos difíciles]]\n- **Fuera de alcance:** … (por qué)\n\n## 3. Arquitectura\n![[Arquitectura#Diagrama]]\n\n## 4. Decisiones clave\n| Decisión | Elegimos | Descartamos | Por qué |\n|---|---|---|---|\n| | | | |\n← [[Decisiones]]\n\n## 5. Cómo absorbe cambios\n_(config externa, módulos reemplazables, evals en un comando)_ ← [[Formato de la prueba]]\n\n## 6. Cómo medimos\n- **Métricas:** … (umbral)\n- **Casos de prueba:** N normales / N límite / N adversariales\n← [[Plan de evaluación]]\n", "mtime": "2026-10-10 09:42"}, {"id": "entregables-diagrama-arquitectura", "title": "diagrama-arquitectura", "path": "docs/entregables/diagrama-arquitectura.md", "group": "entregables", "tags": [], "meta": {}, "md": "# Diagrama de arquitectura — Caja Negra\n\n![Diagrama de arquitectura](assets/dcbf50af-diagrama-arquitectura.png)\n\nRenderizado: `diagrama-arquitectura.png` / `diagrama-arquitectura.svg` (fuente: `diagrama-arquitectura.mmd`, Mermaid + ELK).\n\n**Lectura (de arriba abajo):**\n- **A · Descubrimiento** — único componente que habla con el original (token personal, 10 req/s). Cada request queda en el log con su hipótesis.\n- **Conocimiento** — único puente entre A y B: `experimentos.jsonl` → ajuste + validación predictiva → especificación; y el corpus de regresión (dev / hold-out con otra semilla).\n- **Medición** — el tester diferencial reproduce el corpus contra el reemplazo con el comparador del jurado; el set oculto entra por el mismo adaptador.\n- **B · Reemplazo (hexagonal)** — adaptador HTTP (borde) → pipeline ordenado de validación guiado por el **catálogo de errores** (datos) → **registro de comandos** (un módulo por comando) → **núcleo de dominio puro** → **puerto StateStore** (InMemory activo; Redis opcional). El **perfil de comportamiento** (`BEHAVIOR_PROFILE`) selecciona catálogo y comandos: así se absorbe el cambio de las 15:30 sin tocar el núcleo.\n- Flecha gruesa = camino crítico de cada request. Discontinuo = adaptador posible, no desplegado.\n\n```mermaid\n---\nconfig:\n  layout: elk\n  elk:\n    nodePlacementStrategy: BRANDES_KOEPF\n  flowchart:\n    curve: linear\n    wrappingWidth: 340\n    subGraphTitleMargin:\n      top: 6\n      bottom: 14\n---\nflowchart TB\n    ORIG[(\"Servicio original<br/>Railway · estado por token\")]\n\n    subgraph A[\"A · Descubrimiento\"]\n        direction TB\n        EXP[\"Experimentos exp01…expNN<br/>1 hipótesis por request\"]\n        PRB[\"prober.py<br/>reset → secuencia → registro<br/>10 req/s · reintentos\"]\n        EXP --> PRB\n    end\n\n    subgraph K[\"Conocimiento · git\"]\n        direction TB\n        LOG[(\"experimentos.jsonl<br/>formato oficial\")]\n        FIT[\"Ajuste + validación predictiva<br/>fit_*.py · control_model.py\"]\n        SPEC[\"ESPECIFICACION.md<br/>ID · evidencia · confianza\"]\n        CORP[(\"Corpus de regresión<br/>dev · hold-out (otra semilla)\")]\n        LOG --> FIT --> SPEC\n        LOG --> CORP\n    end\n\n    DIFF[\"Tester diferencial<br/>comparador del jurado → paridad %\"]\n    JUDGE[\"Set oculto del jurado<br/>100 tests · token del equipo\"]\n\n    subgraph B[\"B · Reemplazo\"]\n        direction TB\n        HTTP[[\"Adaptador HTTP · ASGI catch-all<br/>sin framework · nunca llama al original\"]]\n        PIPE[\"Pipeline de validación ordenado<br/>ruta → auth → forma del cuerpo → control<br/>→ sintaxis/aridad → existencia → negocio\"]\n        CAT[(\"Catálogo de errores<br/>código · status · cuerpo exacto · etapa\")]\n        PROF[\"Perfil de comportamiento<br/>BEHAVIOR_PROFILE = v1 | v2<br/>base común + overrides\"]\n        REG[\"Registro de comandos<br/>ALTA · CONSULTA · DEPOSITO<br/>TRANSFER · ANULA · PING\"]\n        DOM[\"Núcleo de dominio<br/>funciones puras (estado, cmd) → (estado', resp)\"]\n        IDS[\"Generadores de IDs<br/>AC-0001 · OP-0001 deterministas\"]\n        PORT{{\"Puerto StateStore<br/>get · apply · snapshot · reset\"}}\n        MEM[(\"InMemoryStore<br/>activo · 1 proceso / 1 réplica\")]\n        RED[(\"RedisStore<br/>opcional · partición por token\")]\n        HTTP ==> PIPE\n        PIPE --> REG\n        REG --> DOM\n        DOM --> PORT\n        PORT --> MEM\n        PORT -.-> RED\n        PROF --> CAT\n        CAT --> PIPE\n        PROF --> REG\n        IDS --> DOM\n    end\n\n    PRB -->|\"HTTPS · token personal\"| ORIG\n    PRB --> LOG\n    CORP --> DIFF\n    DIFF --> HTTP\n    JUDGE --> HTTP\n\n    classDef orig fill:#8b0000,stroke:#5a0000,color:#fff\n    classDef bench fill:#378ADD,stroke:#042C53,color:#fff\n    classDef know fill:#534AB7,stroke:#26215C,color:#fff\n    classDef data fill:#4a4a4a,stroke:#2a2a2a,color:#fff\n    classDef app fill:#1D9E75,stroke:#085041,color:#fff\n    classDef cfg fill:#C98A1B,stroke:#6B4700,color:#fff\n    classDef store fill:#1a5c2a,stroke:#0d3315,color:#fff\n    classDef opt fill:#ffffff,stroke:#1a5c2a,color:#1a5c2a,stroke-dasharray: 5 5\n    classDef meas fill:#B75A34,stroke:#5C2506,color:#fff\n    class ORIG orig\n    class EXP,PRB bench\n    class FIT,SPEC know\n    class LOG,CORP data\n    class HTTP,PIPE,REG,DOM,IDS app\n    class CAT,PROF cfg\n    class PORT,MEM store\n    class RED opt\n    class DIFF,JUDGE meas\n```\n", "mtime": "2026-10-10 10:28"}, {"id": "entregables-doc-diseno-1-pagina", "title": "doc-diseno-1-pagina", "path": "docs/entregables/doc-diseno-1-pagina.md", "group": "entregables", "tags": [], "meta": {}, "md": "# Caja Negra — Doc de diseño (1 página)\n\n**Problema.** Un servicio HTTP sin código ni documentación (`POST /msg` con `\"CMD;args;CONTROL\"`, un mini-libro contable con cuentas, depósitos, transferencias y anulaciones) debe reemplazarse respondiendo **exactamente igual (status + cuerpo), errores incluidos**, en 100 tests ocultos que empiezan con `/__reset`. Dos productos: **conocimiento** (log + spec con evidencia) y **reemplazo** desplegado. El original cambia a las 15:30.\n\n## Supuestos, casos difíciles y fuera de alcance\n| Supuestos (por qué) | Casos difíciles (cómo) | Fuera de alcance (por qué) |\n|---|---|---|\n| Determinista tras reset: IDs `AC-0001`/`OP-0001` secuenciales (ejemplos) · El control depende solo del texto (mismo mensaje → mismo control) · Un estado basta: el set usa el token del equipo; otro token → `401 E001` · Lo no observado recibe un default marcado **supuesto** (regla del reto) | **Valor de control** (mod 97, ISO 7064): ajuste + validación sobre mensajes no vistos · **Precedencia de errores**: mensajes con 2 defectos a la vez · **Estado**: secuencias (alta → depósito → transfer → anula → consulta) · **Rarezas** a preservar: `\"recieved\"`, `cuentaId`/`cuenta_id`, espacio final en E301 · **Rutas/métodos** desconocidos y ruta antes de auth · **Cambio 15:30** | Latencia y headers (`X-Req`): el jurado no los compara · LLM en runtime: el servicio es determinista; añade latencia y ruido · Persistencia durable: el estado se resetea antes de cada test · Bugs de concurrencia: no observables con fiabilidad en un día |\n\n## Arquitectura — ver diagrama-arquitectura.png\n**A · Descubrimiento** (único que habla con el original) → **Conocimiento** (`experimentos.jsonl` → ajuste → spec; corpus dev/hold-out) → **B · Reemplazo hexagonal**: adaptador HTTP ASGI catch-all → **pipeline ordenado** *ruta → auth → forma del cuerpo → control → sintaxis/aridad → existencia → negocio* (familias de error 0xx/2xx/3xx/4xx/5xx) guiado por un **catálogo de errores en datos** (código, status, cuerpo exacto, etapa) → **registro de comandos** (un módulo por ALTA, CONSULTA, DEPOSITO, TRANSFER, ANULA, PING) → **núcleo de dominio puro** `(estado, cmd) → (estado', resp)` → **puerto StateStore** (`InMemoryStore` hoy; `RedisStore` posible) + generadores de IDs deterministas.\n**Escalabilidad, con honestidad:** la capa de aplicación no guarda estado propio (todo pasa por el puerto), así que escala horizontalmente con un store compartido y partición por token. Desplegamos **1 réplica a propósito**: el set habla a un solo proceso y varias réplicas en memoria partirían el estado.\n\n## Decisiones clave\n| Decisión | Elegimos | Descartamos | Por qué |\n|---|---|---|---|\n| Núcleo HTTP | ASGI puro catch-all | FastAPI/Flask routing | Responden solos 404/405/422 y redirigen `/x/`: no-paridad justo donde el set prueba |\n| Estructura | Hexagonal: pipeline + registro + dominio puro | Un handler monolítico con `if` | Cada regla nueva toca un módulo; el dominio se prueba sin HTTP |\n| Errores | Catálogo de datos + orden explícito de etapas | Excepciones dispersas en código | La precedencia es el caso difícil; en datos se compara contra el log y se versiona |\n| Estado | Memoria tras puerto, 1 proceso/1 réplica | Redis/Postgres; varias réplicas | Reset antes de cada test; “el set habla a un proceso”: N réplicas = N estados. Escalar = Redis + partición por token, sin tocar el dominio |\n| Cambio de versión | `BEHAVIOR_PROFILE=v1|v2` (base + overrides) | Editar reglas in situ / ramas | Ambas versiones conviven y se testean; rollback = 1 variable |\n| Descubrimiento | Prober con log + ajuste + validación predictiva | `curl` manual; herramientas auto | Sin rastro no hay evidencia ni regresión; un ajuste que no predice memoriza |\n| Confianza en spec | `confirmado` = repetido ≥2 o predicho | Visto una vez = confirmado | Las afirmaciones falsas restan |\n\n## Cómo absorbe el cambio (15:30)\n1) Re-ejecutar el corpus dev contra el original → **diff por comportamiento** contra el corpus de la mañana. 2) Cada dif
