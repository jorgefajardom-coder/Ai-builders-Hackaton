erencia se vuelve una fila de spec (§6) y un **override** en `profiles/v2` (catálogo o módulo de comando), sin tocar el núcleo. 3) Desplegar con `BEHAVIOR_PROFILE=v2`; el tester verifica v2 contra el corpus nuevo y v1 contra el viejo. Lo que no se pudo reproducir queda **supuesto**.\n\n## Cómo medimos\n| Métrica (comparador idéntico al jurado) | Objetivo |\n|---|---|\n| Tests oficiales (`/evento/resultados`) | ≥ 90/100 |\n| Paridad de casos en **hold-out** (todas las respuestas iguales) / ponderada 40-45-15 como el set | ≥ 90 % |\n| Paridad de pasos / de status | ≥ 97 % / ≥ 99 % |\n| Brecha dev − hold-out (sobreajuste) | < 5 pts |\n| Spec: filas con id de log / `confirmado` que cumplen la regla | 100 % / 100 % |\n| Presupuesto (8.000 req/día/token) · latencia p95 | < 6.000 antes de 18:00 · < 1 s |\n\n| Caso concreto (sale del diseño) | Request (tras reset) | Esperado |\n|---|---|---|\n| Precedencia ruta > auth | `GET /nada` sin token | `404 E404 ruta desconocida` |\n| Precedencia control > aridad | `ALTA` con 2 args y control malo | `400 E202`, no `E302` |\n| Límite de negocio | `TRANSFER` 100000 vs 120000 | `200` vs `422 E506 límite excedido` |\n| Rareza a preservar | 2× `ANULA` de la misma op | 2.ª → `200` con `ok:false` (no error) |\n| Estado | alta → depósito → transfer → consulta | saldos e IDs `OP-000n` exactos |\n\n**Categorías** (reset + N requests, mezcla 40 % de 1 / 45 % de 2–5 / 15 % de 6–12): **normales** (cada comando válido, secuencias con estado) · **límite** (montos 0, negativos, decimales, 100000 vs 120000, saldo exacto, nombres largos/unicode, mayúsculas `CONSULTa`) · **adversariales** (control ±1 y no numérico, 2 defectos a la vez para precedencia, rutas/métodos/slash, auth en minúsculas o ajena, cuerpo no JSON o sin `m`, ANULA doble). Un comando: `python -m bench.diff --target URL --split holdout`, desglosado por categoría.\n", "mtime": "2026-10-10 10:32"}, {"id": "formato-de-la-prueba", "title": "Formato de la prueba", "path": "docs/Formato de la prueba.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Cómo diseñaron la prueba\n\n| # | Característica | Implicación para nosotros | Dónde lo cubrimos |\n|---|---|---|---|\n| 01 | Pruebas del mismo tipo que usan laboratorios como Anthropic u OpenAI para contratar | Evalúan criterio de ingeniería, no solo que funcione: decisiones explícitas, medición y la capacidad de explicarlo | [[Decisiones]] · [[Preguntas probables]] |\n| 02 | Un brief ambiguo, como en la vida real | La ambigüedad es intencional. Cada hueco del brief se convierte en un supuesto escrito, con su razón y qué pasa si es falso. No nos quedamos esperando respuestas | [[Supuestos y alcance]] |\n| 03 | Un set de evaluaciones oculto que corre sobre algo que no han visto | Generalizar, no sobreajustar a nuestros ejemplos. Respetar el formato de entrada/salida al pie de la letra. Fallar de forma controlada (nunca crashear: devolver algo válido) | [[Plan de evaluación]] · [[Entrega]] |\n| 04 | Un incidente a mitad del día, porque en producción las cosas cambian sin avisar | Diseñar para el cambio: configuración fuera del código, componentes desacoplados, evals que se corren en un comando para detectar regresiones. Documentar el incidente al vivo | [[Incidente]] · [[Arquitectura]] |\n\n## Principios de diseño que salen de aquí\n1. **Supuestos explícitos > preguntas abiertas.** Si el brief no lo dice, decidimos, lo escribimos y seguimos.\n2. **Robustez antes que brillantez.** Una respuesta válida y mediocre es mejor que un crash ante el set oculto.\n3. **Todo configurable.** Modelo, prompts, rutas y umbrales se definen en config o env, no hardcodeados.\n4. **Evals en un comando.** Así, después del incidente, sabemos en minutos qué se rompió.\n5. **Cada componente reemplazable.** Si el incidente cambia una fuente de datos o una API, se toca un solo módulo.\n", "mtime": "2026-10-10 09:24"}, {"id": "reglas", "title": "Reglas", "path": "docs/Reglas.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Reglas\n\n| | Regla | Implicación práctica |\n|---|---|---|\n| ✓ | Se pueden y se deben usar modelos y agentes de código. **Se entregan los transcripts y se evalúa cómo los orquestas** | Los transcripts son un entregable más. Hay que trabajar con método: plan → tareas pequeñas → verificar → commit. Pedirle al agente decisiones razonadas, no solo código. Revisar lo que genera. Guardar los transcripts de cada sesión ([[#Transcripts]]) |\n| ✗ | No se pueden usar herramientas o proveedores que hagan el trabajo por ti | Sí valen APIs de modelos, librerías y hosting. No valen plataformas que entreguen la solución armada (no-code end-to-end, templates del mismo problema, servicios \"AI-app-in-a-box\"). Si hay duda, registrarla en [[Decisiones]] con su justificación |\n| ✓ | Todo se construye hoy, en un repo público | Commits desde hoy, pequeños y frecuentes, con mensajes claros: el historial es evidencia. Nada de código previo copiado |\n| ✓ | Las credenciales son por persona: lo que haces en tu escritorio no lo ve tu compañero | Nunca subir secretos. Cada quien con su `.env` local y un `.env.example` versionado. El servicio desplegado usa los secretos de la plataforma de hosting. La configuración debe permitir que cualquiera lo corra con sus propias llaves |\n| ✓ | Presencial y remoto se evalúan con los mismos entregables y los mismos tiempos | Sin ventajas ni excusas: mismo [[Cronograma]] |\n\n## Transcripts\n- Una sesión de agente por tarea grande (diseño, esqueleto, evals, iteración, incidente), con nombre claro.\n- Al cerrar cada sesión: exportar el transcript y guardarlo en `transcripts/` del repo (o donde indiquen los organizadores).\n- Anotar en la bitácora qué sesión resolvió qué cosa.\n\n## Qué evalúa \"cómo orquestas\" (nuestra lectura)\n1. **Contexto:** le das al agente el brief, los supuestos y las restricciones, sin pedirle \"hazme todo\".\n2. **Descomposición:** tareas acotadas y verificables.\n3. **Verificación:** corres tests y evals, y no aceptas código a ciegas.\n4. **Criterio humano:** las decisiones de diseño las tomas tú; el agente propone alternativas.\n5. **Recuperación:** cuando el agente se equivoca, lo detectas y corriges el rumbo.\n", "mtime": "2026-10-10 09:42"}, {"id": "reto-2", "title": "Reto 2", "path": "docs/Reto 2.md", "group": "General", "tags": ["referencia", "reto2"], "meta": {}, "md": "# Reto 2 — La caja negra\n\n> [!abstract] Enunciado\n> Descubre cómo se comporta un servicio sin documentación y construye un reemplazo que responda exactamente igual, **errores incluidos**.\n> Brief y contrato: [[Brief]] · README completo: `material/README.md` · Primeros hallazgos: [[Hallazgos iniciales]]\n\n## Datos clave del material\n| Tema | Dato |\n|---|---|\n| Original | `https://caja-negra-production-c64f.up.railway.app` |\n| Tokens | Uno **por persona** (en `/evento`). **Cada token tiene su propio estado** → se puede explorar en paralelo |\n| Protocolo | `POST /msg` con `{\"m\":\"CMD;args;CONTROL\"}` · `POST /__reset` · `GET /health` |\n| Rate limit | 10 req/s y **8.000 req/día por token**. Si se excede: header `X-Frontier-Infra: rate-limit` (es de la infraestructura, no del servicio: **no** grabarla como comportamiento) |\n| Header `X-Req` | Viene en cada respuesta y va al log (`x_req`) |\n| Cambios | El servicio **puede cambiar durante el día**. Se evalúa contra la versión vigente a las **20:00** |\n| 20:00 | Los tokens de participante **dejan de funcionar** contra el original → todo el corpus tiene que estar grabado antes |\n| LLM | Se permite dentro del reemplazo si responde en < 5 s por paso |\n| Instancias | El set le habla a un solo proceso → **una instancia** ([[ADR-002]]) |\n| Llamar al original | Si el reemplazo lo hace, **el set vale 0** |\n\n## Cómo se evalúa\n- **100 tests**: 40 de 1 request, 45 secuencias de 2–5 y 15 de 6–12. Cada uno empieza con `POST /__reset`. Ninguno repite la secuencia de ejemplo.\n- Pasa si **cada** respuesta tiene el **mismo status** y el **mismo cuerpo**: si es JSON, el orden de claves no importa, pero arrays, strings y números deben ser idénticos; si no es JSON, se compara el texto exacto.\n- **Los headers no se comparan.** 5 s por paso.\n- Se puede validar en `/evento` y ver el resultado en `/evento/resultados` → **feedback real durante el día**.\n- **Spec:** un juez la compara con la lista completa de comportamientos. Cuenta cada uno bien descrito **y que cite una línea del log**. **Una afirmación falsa resta.**\n\n## Entregables extra\n- **Especificación** → [[Especificación]] (estructura fija de 7 secciones)\n- **`experimentos.jsonl`** → [[Log de experimentos]] (una línea por request al original)\n\n## Preguntas abiertas\n- [ ] **Fórmula del control** → [[Hallazgos iniciales#El control (pendiente)]]\n- [ ] Orden de evaluación de los errores (¿integridad → sintaxis → existencia → negocio?)\n- [ ] Respuesta del original sin token, con token inválido y en rutas inexistentes / otros métodos\n- [ ] ¿`ANULA` revierte el saldo? ¿Se puede anular un `DEPOSITO`? ¿Y si deja saldo negativo?\n- [ ] Límite exacto de `TRANSFER` (¿100000?) y si existe para `DEPOSITO`\n- [ ] Montos 0, negativos, con decimales o no numéricos; transferencia a la misma cuenta\n- [ ] Nombres en `ALTA`: vacíos, con unicode, largos, duplicados\n- [ ] ¿Qué es `X-Req`? (¿contador de requests por token?)\n- [ ] Pestaña **Aclaraciones** de la web\n", "mtime": "2026-10-10 09:50"}, {"id": "rúbrica", "title": "Rúbrica", "path": "docs/Rúbrica.md", "group": "General", "tags": ["referencia"], "meta": {}, "md": "# Rúbrica\n\n| Etapa | Peso | Qué se entrega |\n|---|---|---|\n| 01 · Systems design | 30% | Doc de diseño + diagrama (cierre 12:00) |\n| 02 · Ejecución | 40% | Repo, entrypoint, video y set de evaluaciones oculto |\n| 03 · Demo day | 15% | Pitch en tu turno + material opcional |\n| 04 · Profundidad técnica | 15% | Debrief individual de 10 minutos |\n\n## Systems design (escala 1–4 por criterio)\nSe alimenta de: doc de diseño, diagrama de arquitectura.\n\n| Criterio | Qué buscan | 1 se ve así | 4 se ve así | Dónde lo cubrimos |\n|---|---|---|---|---|\n| Entendimiento del problema | Qué tiene que resolver el sistema, sus límites y sus supuestos | Repite el brief sin tomar decisiones | Nombra supuestos, casos difíciles y lo que deja fuera, con razones | [[Supuestos y alcance]], [[Casos difíciles]] |\n| Arquitectura y trade-offs | Componentes claros y decisiones justificadas | Un diagrama sin decisiones detrás | Cada decisión dice qué alternativa descartó y por qué | [[Arquitectura]], [[Decisiones]] |\n| Plan para medir | Cómo van a saber si funciona antes de construir | No hay forma de medir el resultado | Casos de prueba y métricas concretas desde el diseño | [[Plan de evaluación]] |\n", "mtime": "2026-10-10 09:17"}], "exp": {"total": 1580, "budget": 8000, "seqs": [{"seq": "s1-entrada", "n": 18, "first": 1, "last": 18, "hipotesis": "GET /health con token propio responde 200"}, {"seq": "s2-control", "n": 719, "first": 19, "last": 737, "hipotesis": "barrido de control para 'CONSULTA;AC-0000': ¿0 es válido?"}, {"seq": "s3-prediccion", "n": 8, "first": 738, "last": 745, "hipotesis": "el modelo de control predice 72 para 'CONSULTA;ZZ-9876' (no debe dar E202)"}, {"seq": "s4-letras", "n": 502, "first": 746, "last": 1247, "hipotesis": "barrido de control para 'CONSULTA;Z': ¿0 es válido?"}, {"seq": "s5-formula", "n": 13, "first": 1248, "last": 1260, "hipotesis": "la fórmula 98-(N·100 mod 97) con A=1..Z=26 concatenadas predice 85 para 'ALTA;maria' (ALTA con nombre en minúsculas (letras J..Z de dos cifras: r)); no debe dar E202"}, {"seq": "s6-control-formato", "n": 30, "first": 1261, "last": 1290, "hipotesis": "cero a la izquierda '014': si se parsea como entero vale 14 -> E401; si se compara texto -> E202"}, {"seq": "s7-segmentos", "n": 20, "first": 1291, "last": 1310, "hipotesis": "control 8 escrito '08' (2 caracteres con cero): si el formato es ^\\d{1,2}$ -> E401; si prohíbe ceros a la izquierda -> E201"}, <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module">
// Mermaid 11 + layout ELK: enrutado ortogonal que evita que las aristas crucen nodos o se superpongan.
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.1.7/dist/mermaid-layout-elk.esm.min.mjs';
mermaid.registerLayoutLoaders(elkLayouts);
window.mermaid = mermaid;
const D = JSON.parse(document.getElementById('data').textContent);
const VERSION = document.querySelector('meta[name=doc-version]').content;
let lang = 'es';
try { lang = localStorage.getItem('docs-lang') || 'es'; } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Índice de notas por título (para resolver [[wikilinks]] de Obsidian).
const byTitle = {};
D.docs.forEach(d => { byTitle[d.title.toLowerCase()] = d; byTitle[d.path.replace(/^docs\//,'').replace(/\.md$/,'').toLowerCase()] = d; });
const headingId = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');

// Solo fuera de bloques de código: dentro de ```mermaid, `[[...]]` es sintaxis (nodo subrutina), no un enlace.
function wikilinks(md){
  return md.split(/(```[\s\S]*?```)/g).map((part, i) => i % 2 ? part : wikilinksText(part)).join('');
}
function wikilinksText(md){
  return md.replace(/!?\[\[([^\]|#]+)(#[^\]|]+)?(\|([^\]]+))?\]\]/g, (m, target, sec, _a, alias) => {
    const d = byTitle[target.trim().toLowerCase()];
    const label = alias || (target.split('/').pop() + (sec ? ' › ' + sec.slice(1) : ''));
    if (!d) return `<span class="wl-missing" title="Nota aún no creada">${esc(label)}</span>`;
    return `[${label}](#/doc/${d.id}${sec ? '~' + headingId(sec.slice(1)) : ''})`;
  });
}

const renderer = new marked.Renderer();
renderer.code = (code, info) => {
  if ((info || '').trim() === 'mermaid') return `<div class="mermaid">${esc(code)}</div>`;
  return `<pre><code>${esc(code)}</code></pre>`;
};
renderer.heading = (text, level, raw) => `<h${level} id="${headingId(raw)}">${text}</h${level}>`;
marked.setOptions({ renderer, gfm: true });

function callouts(root){
  root.querySelectorAll('blockquote').forEach(bq => {
    const p = bq.querySelector('p'); if (!p) return;
    const m = p.innerHTML.match(/^\[!(\w+)\][+-]?\s*([^<\n]*)/); if (!m) return;
    p.innerHTML = p.innerHTML.slice(m[0].length).replace(/^\s*<br>/, '');
    const div = document.createElement('div');
    div.className = 'callout ' + m[1].toLowerCase();
    div.innerHTML = `<div class="ct">${esc(m[2] || m[1])}</div>` + bq.innerHTML;
    bq.replaceWith(div);
  });
}

// Los enlaces relativos a archivos del repo apuntan a GitHub.
const REPO = 'https://github.com/jorgefajardom-coder/Ai-builders-Hackaton/blob/main/';
function fixLinks(root){
  root.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (h.startsWith('#') && !h.startsWith('#/')) {
      a.addEventListener('click', e => { e.preventDefault(); document.getElementById(h.slice(1))?.scrollIntoView({behavior:'smooth'}); });
    } else if (!/^(https?:|#|mailto:)/.test(h)) {
      a.href = REPO + h.replace(/^\.\//, ''); a.target = '_blank';
    }
  });
}

const SVGNS = 'http://www.w3.org/2000/svg';
let packetSeq = 0;

// Convierte cada conexión en un flujo animado y le agrega un paquete que viaja origen → destino.
// El retraso de cada paquete sigue el orden de las aristas en el diagrama, así se lee la secuencia.
function animateFlows(root){
  root.querySelectorAll('.mermaid svg').forEach(svg => {
    const edges = [];
    svg.querySelectorAll('path.flowchart-link, .edgePaths path, .edgePath path.path').forEach(p => { if (!edges.includes(p)) edges.push(p); });
    // Diagramas de secuencia: los mensajes son <line> o <path>; se convierten a path para poder recorrerlos.
    svg.querySelectorAll('line[class*="messageLine"]').forEach(l => {
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', `M${l.getAttribute('x1')},${l.getAttribute('y1')} L${l.getAttribute('x2')},${l.getAttribute('y2')}`);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'none');
      l.parentNode.insertBefore(p, l.nextSibling);
      l.classList.add('flow'); if (l.classList.contains('messageLine1')) l.classList.add('dotted');
      edges.push(Object.assign(p, { _seq: true }));
    });
    svg.querySelectorAll('path[class*="messageLine"]').forEach(p => edges.push(p));
    edges.forEach((p, i) => {
      if (!p._seq) {
        p.classList.add('flow');
        const da = getComputedStyle(p).strokeDasharray;
        if (p.classList.contains('edge-pattern-dotted') || p.classList.contains('messageLine1') || (da && da !== 'none' && parseFloat(da) <= 3)) p.classList.add('dotted');
      }
      let len = 0; try { len = p.getTotalLength(); } catch (e) {}
      if (!len) return;
      if (!p.id) p.id = 'flowpath-' + (++packetSeq);
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('r', '4'); c.setAttribute('class', 'packet');
      const m = document.createElementNS(SVGNS, 'animateMotion');
      const dur = Math.max(1.2, Math.min(4, len / 90));
      m.setAttribute('dur', dur.toFixed(2) + 's');
      m.setAttribute('begin', ((i * 0.35) % 4).toFixed(2) + 's');
      m.setAttribute('repeatCount', 'indefinite');
      m.setAttribute('rotate', 'auto');
      const mp = document.createElementNS(SVGNS, 'mpath');
      mp.setAttribute('href', '#' + p.id);
      m.appendChild(mp); c.appendChild(m);
      p.parentNode.appendChild(c);
    });
  });
}

// Verificador de diagramas: devuelve las aristas que atraviesan nodos ajenos, pisan títulos de grupo
// o etiquetas de otras aristas, o se cruzan entre sí. [] = diagramas limpios. Uso: checkOverlaps() en consola.
window.checkOverlaps = function(){
  const out = [];
  document.querySelectorAll('#content .mermaid svg').forEach((svg, d) => {
    const inv = svg.getCTM().inverse();
    const box = el => { const b = el.getBBox(), t = inv.multiply(el.getCTM());
      const p = new DOMPoint(b.x, b.y).matrixTransform(t), q = new DOMPoint(b.x + b.width, b.y + b.height).matrixTransform(t);
      return { x1: Math.min(p.x, q.x), y1: Math.min(p.y, q.y), x2: Math.max(p.x, q.x), y2: Math.max(p.y, q.y), el }; };
    const visible = sel => [...svg.querySelectorAll(sel)].filter(e => e.getBBox().width > 0).map(box);
    const nodes = visible('g.node'), titles = visible('g.cluster-label'), labels = visible('g.edgeLabel');
    const S = [...svg.querySelectorAll('path.flowchart-link')].map(p => {
      const L = p.getTotalLength(), m = inv.multiply(p.getCTM()), pts = [];
      for (let s = 0; s <= L; s += 3) { const q = p.getPointAtLength(s); pts.push(new DOMPoint(q.x, q.y).matrixTransform(m)); }
      return { id: p.id, pts };
    });
    const inside = (pt, r, pad) => pt.x > r.x1 + pad && pt.x < r.x2 - pad && pt.y > r.y1 + pad && pt.y < r.y2 - pad;
    const owner = labels.map(l => { const cx = (l.x1 + l.x2) / 2, cy = (l.y1 + l.y2) / 2; let best = null, bd = 1e9;
      S.forEach(s => s.pts.forEach(p => { const dd = Math.hypot(p.x - cx, p.y - cy); if (dd < bd) { bd = dd; best = s.id; } })); return best; });
    S.forEach(s => {
      const a = s.pts[0], b = s.pts[s.pts.length - 1];
      nodes.forEach(n => { if (!inside(a, n, -12) && !inside(b, n, -12) && s.pts.some(p => inside(p, n, 2))) out.push({ d, type: 'arista-atraviesa-nodo', edge: s.id, node: n.el.id }); });
      titles.forEach(t => { if (s.pts.some(p => inside(p, t, 0))) out.push({ d, type: 'arista-sobre-titulo', edge: s.id, title: t.el.textContent.slice(0, 40) }); });
      labels.forEach((l, k) => { if (owner[k] !== s.id && s.pts.some(p => inside(p, l, 1))) out.push({ d, type: 'arista-sobre-etiqueta-ajena', edge: s.id, label: l.el.textContent.slice(0, 40) }); });
    });
    for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
      const A = S[i].pts, B = S[j].pts, ends = [A[0], A[A.length - 1], B[0], B[B.length - 1]];
      let hit = null;
      for (const p of A) { if (ends.some(e => Math.hypot(e.x - p.x, e.y - p.y) < 16)) continue;
        if (B.some(q => Math.hypot(p.x - q.x, p.y - q.y) < 2)) { hit = p; break; } }
      if (hit) out.push({ d, type: 'aristas-se-cruzan', a: S[i].id, b: S[j].id, at: [Math.round(hit.x), Math.round(hit.y)] });
    }
  });
  return out;
};

let renderToken = 0;
async function show(md, meta){
  const token = ++renderToken;
  const el = document.getElementById('content');
  el.innerHTML = (meta || '') + marked.parse(wikilinks(md));
  callouts(el); fixLinks(el);
  // Un diagrama a la vez; si el usuario navegó mientras se dibujaba, se abandona el render viejo.
  for (const node of el.querySelectorAll('.mermaid')) {
    if (token !== renderToken) return;
    try { await mermaid.run({ nodes: [node] }); } catch (e) { console.warn('mermaid', e); }
  }
  if (token === renderToken) animateFlows(el);
}

function viewHome(){
  show(D.readme[lang] || D.readme.es);
}

function viewDoc(id, anchor){
  const d = D.docs.find(x => x.id === id);
  if (!d) return show('# Nota no encontrada');
  const meta = `<div class="meta"><span>${esc(d.path)}</span><span>· editado ${esc(d.mtime)}</span>${d.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>`;
  show(d.md, meta);
  if (anchor) setTimeout(() => document.getElementById(anchor)?.scrollIntoView(), 50);
}

function viewExp(){
  const E = D.exp;
  if (!E) return show('# Experimentos\n\nAún no hay `experimentos.jsonl`.');
  const pct = Math.min(100, E.total / E.budget * 100).toFixed(1);
  const statusCls = s => 's' + String(s)[0];
  let h = `<h1>Experimentos</h1>
  <p>Generado desde <code>experimentos.jsonl</code>: una línea por cada request al servicio original.</p>
  <div class="cards">
    <div class="card"><div class="k">Requests al original</div><div class="v">${E.total}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="mono">${pct}% del cupo diario (${E.budget})</div></div>
    <div class="card"><div class="k">Secuencias</div><div class="v">${E.seqs.length}</div></div>
    <div class="card"><div class="k">Códigos de error vistos</div><div class="v">${E.errors.length}</div></div>
    <div class="card"><div class="k">Status HTTP</div><div class="v mono" style="font-size:15px">${Object.entries(E.status).map(([s,n]) => `<span class="${statusCls(s)}">${s}</span>×${n}`).join(' · ')}</div></div>
  </div>
  <h2>Catálogo de errores observado</h2>
  <table><thead><tr><th>Código</th><th>Status</th><th>Mensaje exacto</th><th>Veces</th><th>Primera evidencia</th></tr></thead><tbody>
  ${E.errors.map(e => `<tr><td class="mono">${esc(e.code)}</td><td class="mono ${statusCls(e.status)}">${e.status}</td><td class="mono">"${esc(e.mensaje)}"</td><td>${e.count}</td><td class="mono">#${e.first}</td></tr>`).join('')}
  </tbody></table>
  <h2>Secuencias</h2>
  <table><thead><tr><th>Seq</th><th>Requests</th><th>Ids</th><th>Hipótesis inicial</th></tr></thead><tbody>
  ${E.seqs.map(s => `<tr><td class="mono">${esc(s.seq)}</td><td>${s.n}</td><td class="mono">#${s.first}–#${s.last}</td><td>${esc(s.hipotesis)}</td></tr>`).join('')}
  </tbody></table>
  <h2>Log (sin el ruido de los barridos)</h2>
  <input class="search" id="expq" placeholder="Filtrar por id, seq, mensaje, error…">
  <table id="exptable"><thead><tr><th>#</th><th>Seq</th><th>Request</th><th>Status</th><th>Respuesta</th><th>Hipótesis</th></tr></thead><tbody>
  ${E.notable.slice().reverse().map(r => `<tr><td class="mono">${r.id}</td><td class="mono">${esc(r.seq)}</td><td class="mono">${esc((r.metodo||'') + ' ' + (r.ruta||''))}<br>${esc(typeof r.request === 'object' && r.request ? JSON.stringify(r.request) : (r.request ?? ''))}</td><td class="mono ${statusCls(r.status)}">${r.status}</td><td class="mono">${esc(typeof r.response === 'object' ? JSON.stringify(r.response) : r.response)}</td><td>${esc(r.hipotesis)}${r.conclusion ? '<br><b>→ ' + esc(r.conclusion) + '</b>' : ''}</td></tr>`).join('')}
  </tbody></table>`;
  const el = document.getElementById('content'); el.innerHTML = h;
  document.getElementById('expq').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#exptable tbody tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none');
  });
}

function viewHistory(){
  show('# Historial\n\nCommits del repositorio (más recientes primero). Cada commit regenera esta documentación.\n\n| Commit | Fecha | Mensaje |\n|---|---|---|\n' +
    D.commits.map(c => `| [\`${c.hash}\`](https://github.com/jorgefajardom-coder/Ai-builders-Hackaton/commit/${c.hash}) | ${c.date} | ${c.msg.replace(/\|/g,'\\|')} |`).join('\n'));
}

function viewMaterial(){ show(D.material || '# Material\n\nNo disponible.'); }

function buildNav(filter){
  const q = (filter || '').toLowerCase();
  const match = d => !q || d.title.toLowerCase().includes(q) || d.md.toLowerCase().includes(q);
  const groups = {};
  D.docs.filter(match).forEach(d => (groups[d.group] = groups[d.group] || []).push(d));
  let h = `<div class="navgroup"><h4>Proyecto</h4>
    <a href="#/" data-r="#/">Documento de diseño (README)</a>
    <a href="#/exp" data-r="#/exp">Experimentos · ${D.exp ? D.exp.total : 0}</a>
    <a href="#/material" data-r="#/material">Material del reto</a>
    <a href="#/historial" data-r="#/historial">Historial · ${D.commits.length} commits</a></div>`;
  Object.keys(groups).sort((a,b) => a === 'General' ? -1 : b === 'General' ? 1 : a.localeCompare(b)).forEach(g => {
    h += `<div class="navgroup"><h4>${esc(g)}</h4>` + groups[g].map(d => `<a href="#/doc/${d.id}" data-r="#/doc/${d.id}">${esc(d.title)}</a>`).join('') + '</div>';
  });
  document.getElementById('navlist').innerHTML = h;
  markActive();
}

function markActive(){
  let r = location.hash.split('~')[0] || '#/';
  try { r = decodeURIComponent(r); } catch (e) {}
  document.querySelectorAll('#navlist a').forEach(a => a.classList.toggle('active', a.dataset.r === r));
}

function route(){
  let h = location.hash || '#/';
  try { h = decodeURIComponent(h); } catch (e) {}
  const [path, anchor] = h.slice(1).split('~');
  if (path.startsWith('/doc/')) viewDoc(path.slice(5), anchor);
  else if (path === '/exp') viewExp();
  else if (path === '/historial') viewHistory();
  else if (path === '/material') viewMaterial();
  else viewHome();
  markActive();
  document.getElementById('nav').classList.remove('open');
  if (!anchor) window.scrollTo(0, 0);
}

function setLang(l, render = true){
  lang = l; try { localStorage.setItem('docs-lang', l); } catch (e) {}
  document.getElementById('lang-es').classList.toggle('on', l === 'es');
  document.getElementById('lang-en').classList.toggle('on', l === 'en');
  if (render && (location.hash || '#/') === '#/') viewHome();
}

function initTheme(){
  const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  try { const t = localStorage.getItem('docs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const apply = () => mermaid.initialize({
    startOnLoad: false, theme: dark() ? 'dark' : 'default', securityLevel: 'strict',
    layout: 'elk', look: 'classic',
    elk: { mergeEdges: false, nodePlacementStrategy: 'NETWORK_SIMPLEX', cycleBreakingStrategy: 'GREEDY' },
    flowchart: { curve: 'linear', padding: 14, nodeSpacing: 40, rankSpacing: 60, htmlLabels: true },
    sequence: { mirrorActors: false, messageMargin: 34 },
  });
  apply();
  document.getElementById('theme').onclick = () => {
    const t = dark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('docs-theme', t); } catch (e) {}
    apply(); route();
  };
}

// Recarga automática: si el sitio se sirve por HTTP y hay una versión nueva, recarga la página.
function liveReload(){
  const dot = document.getElementById('livedot');
  if (!/^https?:/.test(location.protocol)) { dot.style.background = 'var(--muted)'; dot.title = 'Abierto como archivo: sin recarga automática'; return; }
  if (new URLSearchParams(location.search).has('nolive')) { dot.style.background = 'var(--warn)'; dot.title = 'Recarga automática pausada (?nolive)'; return; }
  dot.title = 'Recarga automática activa';
  setInterval(async () => {
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (v.version && v.version !== VERSION) location.reload();
    } catch (e) {}
  }, 10000);
}

document.getElementById('genat').textContent = 'Actualizado ' + D.generated + ' · v' + VERSION;
document.getElementById('q').addEventListener('input', e => buildNav(e.target.value));
document.getElementById('lang-es').onclick = () => setLang('es');
document.getElementById('lang-en').onclick = () => setLang('en');
document.getElementById('menu').onclick = () => document.getElementById('nav').classList.toggle('open');
document.getElementById('anim').onclick = e => { const off = document.body.classList.toggle('noanim'); e.currentTarget.classList.toggle('on', !off); };
window.addEventListener('hashchange', route);
initTheme(); setLang(lang, false); buildNav(); route(); liveReload();
</script>
